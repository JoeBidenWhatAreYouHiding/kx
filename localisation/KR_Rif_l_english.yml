### Events ###

### Domestic ###
RIF.1.t:0 "Rif Republic Lives Once More!"
RIF.1.d:0 "The time has come to once more cast away the Spanish yoke! The cowardly Spaniards flee from the way of the Riffian patriots, and with the Rif garrison in shambles, Abd el-Krim shall consolidate his republic, fighting to the last man for the future of the Riffian people. The Spanish mainland is in chaos, so a more perfect time could never come, and with the help of our allies in Algeria, Egypt and Istanbul, we will reclaim all of Morocco until a true Islamic and Kemalist republic has been formed here in the edges of the Maghreb. The fight for anti-colonial liberation of all Berbers and Arabs begins here, and we shall carry our duty to the end as we did a decade ago."
RIF.1.a:0 "To victory!"

RIF.2.t:0 "The Burning Sands of Rif"
RIF.2.d:0 "The collapse of Spain finds the small colonial holding of Northern Morocco isolated and in turmoil. When armies wage war on the peninsula, causing untold loss of human life, the Rif finds itself in a similar predicament, with the rebelling tribesmen of Abd el-Krim, the bandits of Mulai Ahmed er Raisuni and the republicans of Tétouanall eyeing the burgeoning military government of José Enrique Varela Iglesias with hungry eyes. The Spanish Legion left for the mainland in a hurry, José Millán-Astray y Terreros as their leader, and general governor Varela was left with a single legionary group and the Regulares under Mohammed ben Mizzian to defend against their numerous enemies. The strongholds of Ceuta and Melilla are the only true holdings Varela controls, with some support from the Jalifa in Tétouan and the local councils of Tangier on the way.\n\nAbd el-Krim may not control as vast of an army as a decade earlier, but the situation is far from ideal either way, and it is only a matter of time until the battle for the control of the protectorate begins in earnest. However, with their numerous enemies mustering against the Protectorate, there is a sign of doubt even among the Spanish loyalists. Governor general Varela, trusted ally of general José Sanjurjo, was given the post partially because of his charismatic and inspiring leadership, but also because the man may possess Carlist sympathies. As such, Spanish officers and administrators loyal to Madrid view him with suspicion, and only time will tell if his true loyalty is to the Alfonsine eagle or the Burgundian Cross. That is, if the Protectorate survives at all..."
RIF.2.a:0 "Things could certainly be better."

RIF.3.t:0 "Fuerzas Regulares Indígenas"
RIF.3.d:0 "The Spanish army in the metropole has always been something of a mixed bag, with very varying quality of officers, weapons and troops posted in different corners of the nation. The lack of good training compounds with the severe drought of good equipment for the army, and many soldiers are little more than servants to their officers, with many being unable to even fire their weapons accurately or service them properly. However, one area where the Spanish army is more than a match for any other European power is in its African units, or Fuerzas Militares de Marruecos as they are known in the military. These troops, hardened by many skirmishes with the Rif rebels and reinforced by the elite troops of the Spanish Foreign Legion, are mainly made up of the tabors of the Regulares, units made up of local Rifian and Moroccan soldiers with most of their leadership made up of Spaniards.\n\nArmed with the best the Oviedo arsenals can offer, the Regulares are primarily infantry troops and often occupy the same role as the Legionaries, with them being used as shock troops. This role does cause quite a bit more casualties to these divisions, but given their experience, the Regulares are some of the only forces in Spain capable of undertaking such a dangerous task. They were used in the capacity during the Asturias rising, where they proved themselves an effective, if not extremely ruthless force, not lessened by the brutal attitude of their commanders such as Juan Yagüe y Blanco and Francisco Franco. The Regulares are primarily made up of infantry, but given the conditions of the Rif, two groups of cavalry are also present. As can be expected from such a valuable unit, they have been awarded nearly as much as the Spanish Legion for their combat prowess, and some, such as Mohamed Meziane, or Mohammed ben Mizzian, have even risen to the rank of Lieutenant General.\n\nThe prestige of these troops and their many actions during wartime have even formed an odd bond between the local troops and their Spanish officers, with many using the connection between Spain and Morocco as a means to explain the fraternal nature between Spanish troops and Rifian Regulares, though despite the close nature of the men and their officers, the Spaniards still hold a very paternalistic view of their troops. With the collapse of the kingdom and the insular situation of the protectorate, many Regulares have defected to the armies of el-Krim, and the remaining ones are viewed with suspicion, especially since Meziane is known to hold a degree of loyalty to the Sultan of Casablanca. Nonetheless, with most Legionaries of Spain fighting on the mainland, Varela must trust the indigenous troops or perish alone."
RIF.3.a:0 "Fiel Regular hasta morir!"

RIF.4.t:0 "Tiradores de Ifni"
RIF.4.d:0 "As the Spanish territories in Africa watch the peninsular tragedy unfold, some territories find themselves far more defended than others. Most importantly, the city of Sidi Ifni, a mere exclave of the larger North African protectorate nestled at the side of the far larger country of Morocco, finds itself in a precarious position. With Spain lost and the protectorate under siege, many fear that the Casablanca regime may try to utilize this weakness to their advantage. However, the Tiradores de Ifni, created by generals Sanjurjo and Franco in 1933 to combat the encroaching Moroccan regime, are always ready to face this threat.\n\nThe Tiradores were modelled after the French Tirailleurs used by the Algiers regime, being light infantry in nature but shock troops in use, with this interest towards a group like this coming from the experience of fighting alongside French Tirailleurs during the Rif War. Similar to the Regulares of Northern Morocco in gear, uniforms and usage, with the only real difference being that the Tiradores wear a tunic named siroquera and have their own star and crescent emblem. These Tiradores are led by a colonel Oswaldo Fernando de la Caridad Capaz y Montes, who has assumed leadership of the Ifni region with the local authorities under direction supervision of High Commissioner Varela.\n\nHowever, Capaz has aroused a degree of suspicion among the most conservative sectors of the Protectorate command, as he is known to hold some republican sentiments even if he has declared his loyalty to the kingdom. As such, while the Tiradores are a welcome addition to the forces of the Protectorate, and hold a great deal of importance in holding the garrison of Sidi Ifni afloat, they are under a lot of surveillance from the Varela loyalists within the colonial administration because of Capaz."
RIF.4.a:0 "Ifni’s loyal sons."

RIF.5.t:0 "Tropas Nómadas del Sahara"
RIF.5.d:0 "The Spanish Sahara or Rio de Oro, as it was originally called, is a remote region with very little actual development or even population to speak of. However, like any region of Spain, it is defended by the Spanish military, and like the much more populous region of Rif, Spanish Sahara mostly employs troops from the local Sahrawi tribesmen. These troops are known as the Tropas Nómadas, an auxiliary force created to patrol the vast deserts of the Golden River. Originally, these lands had a small gendarmerie troop Compañia de Policia a Pie, but it was soon militarised a bit further with the creation of the Tropas de Policia del Sahara, who received camel mounts and patrolled far greater distances than the original group, who mainly guarded the more important coastal regions. Successes with the Tropas de Policia led to the creation of an actual military force with the Tropas Nómadas, with Spanish officers and NCOs as well as a few specialists.\n\nThe creation of such a force was partially inspired by the successes of French army Meharistes as well as the use of the Regulares indigenous force in the Rif, and while the Tropas Nómadas remains a small force, employing mostly locals with knowledge of the terrain and the necessities of survival in these difficult lands, they are proving to be an excellent unit for the task of patrolling the deserts. While there is little of value in the region, some trade routes between Morocco, Mittelafrika’s northernmost territories and the Nationalist French regime do run through Rio de Oro and thus the presences of these police forces does prevent Berbers and other local tribes from preying on trade caravans. Similarly, while Tropas Nómadas is not a true military force and the loyalty of the locals in a time of war is questionable to many Spanish officers, they may act as a first line of defence should Spain find itself at war with the various imperialist powers around itself.\n\nMorocco especially claims Spanish Sahara at its own, so the presence of a police force with rapid response potential in the region does dissuade Casablanca’s king from trying anything. While the experience of these troops is far from that of the regular infantry troops, governor general Varela has had little choice but to bring these camelry troops to the Rif to hunt down the tribesmen of Abd el-Krim and the bandits of er Raisuni, though many fear that they may turn on their Spanish masters all the same."
RIF.5.a:0 "They might not be of the same value as the Regulares but they are something at least."

RIF.6.t:0 "Dealing with the Barbary Pirate"
RIF.6.d:0 "Mulai Ahmed er Raisuni, or the Eagle of Zinat as he is known among his followers, is the leader of the Jebala confederation of Rif tribes, and a man who has become a legend among the Riffians and Moroccans. But to the Spanish administration, he is an old ally and current terror, for his gang plunders the Rif countryside, raids the outposts of colonial order and causes diplomatic incidents with the Moroccan nation to the south of our protectorate. From his youth to this day, Raisuni engages in crime of all sorts, from kidnappings, robberies, piracy to even cattle raiding, the man is always on the move and never far from fat loot. During the first war against the forces of Abd el-Krim, er Raisuni was defeated by Spanish troops and in what could be described as a token of mercy, his group was spared in exchange for support against el-Krim.\n\nHowever, it was not long until he was attacked by the rebellious Riffians and nearly wiped out, managing to escape to the Atlas mountains with a band of loyal men and women to lick his wounds. The bandit lord laid low for years, engaging in petty thievery and occasional attacks on Moroccan, French and Spanish forces, but now, he has grown ever bolder. Perhaps it is the old age catching up to him that makes Raisuni want to go out in a blaze of glory, or perhaps it is the instability of the protectorate, but either way, he has returned like a bad memory to the ranks of the Riffians, rallying the Jebalas once more. Unless swift action is taken, the warlord will become a thorn in the side of the colonial administration, but the amount of effort aimed at curtailing the monster is being debated among the Africanist officers.\n\nBrigadier general José López-Pinto Berizo, leader of the Ceuta artillery unit, has suggested utilizing a small force given the weakened state of er Raisuni’s forces, as sending many of the thinly-stretched Regulares and Legionaries to destroy a relatively minor threat would leave the Protectorate vulnerable to the forces of el-Krim. However, colonel Miguel López Bravo, who fought er Raisuni before during the Rif War, claims that the Spanish administration cannot underestimate the man, for his fighters and allies are fierce and cunning desert foxes and well-capable of escaping or even destroying a small Spanish force. He views López-Pinto’s plan as overtly cautious and austere, given the threat of er Raisuni, and thus suggests sending at least three times the amount of troops proposed by the brigadier general."
RIF.6.a:0 "Go with López-Pinto plan."
RIF.6.b:0 "Go with López Bravo plan."

RIF.7.t:0 "Massacre at Zinat"
RIF.7.d:0 "The evening sun was scorching the plains of Northern Morocco, when Spanish troops entered the outskirts of the town of Zinat. The birthplace of Mulai Ahmed er Raisuni, it had stood against the decay of time proudly, but the Regulares and Legionaries under Brigadier general José López-Pinto wished merely to see it in ashes, with the head of er Raisuni on a pike as a warning to those seeking a future career in banditry. Yet as the force of a few hundred men flooded into the small village, nestled on a hillside, they found themselves quickly surrounded by Jebala tribesmen. The brigadier general had expected a small force meant to delay the Spaniards as they advanced so that the bandit leader could flee, but what followed was a pitched battle where the desperate Spanish defence at the village square was mercilessly picked at, with Moor and Spanish troops dying from the old firearms of the tribesmen as they darted between streets and attacked from unexpected directions.\n\nFor every Legionary and Regulares riflemen killed, a tribesman or two would be cut down by the Mausers and Astras of the colonials, but it soon became evident that the battle was over for the Spaniards. López-Pinto ordered a retreat but as they attempted to fight their way through the ring of tribal militia, er Raisuni’s personal guard joined the fray, and only a handful of survivors managed to flee the scene, with brigadier general López-Pinto slain by one of the guards. Er Raisuni would escape, and the bloodbath of Zinat would serve as a grim reminder of just how feeble the Protectorate’s grip truly was on the wild lands of the Rif."
RIF.7.a:0 "Mierda!"

RIF.8.t:0 "The Eagle’s Wings Severed"
RIF.8.d:0 "The sun hung low over the desolate Riffian lands, uncaring of the world below as the forces of colonel Miguel López Bravo approached the town of Zinat. The large force of Legionaries and Regulares had completely encircled the town, and after a command from the colonel, Hotchkiss Mle.14 machine guns were set up around the village. The following staccato of gunfire caused some amount of panic among the defenders of the village, and as the Spanish troops began their advance, some of the followers of the Eagle of Zinat fled in terror, only to be cut down by the barrage. Rifle volleys cut down those Riffian troops who attempted to flank the machine guns, and soon it became evident that the ambush planned by er Raisuni’s men was completely foiled.\n\nThe village continued to be hammered by bullets, and er Raisuni among his honour guard attempted a breakout with a charge of cavalry and camels, with the remaining footsoldiers rushing behind them. The charge succeeded at breaking through the ring of defenses, but not before the bandit leader was struck by a burst of lead, sending him tumbling down to the sands he had so long haunted. Their leader’s blood seeping to the ground, the bandits and tribesmen of Zinat escaped, died or surrendered one by one, and the battle came to its predictable conclusion. The Spanish Protectorate and its officials could rest a little easier now that at least one major threat to their rule had been eliminated."
RIF.8.a:0 "Excellent."

RIF.9.t:0 "The Question of the Makhzen"
RIF.9.d:0 "The Spanish Protectorate of Northern Morocco is nominally under the rule of the Moroccan Sultan, Mohammed V, but in truth, the two parts of the Maghreb have been separated ever since the establishment of the Kingdom of Morocco. The true ruler of Northern Morocco is the Spanish-appointed High Commissioner, who oversees all Spanish actions in the protectorate and leads politically with the assistance of colonial departments, such as Indigenous Affairs Development and Finance. However, the legislative work is not within the hands of the High Commissioner, at least de jure, but instead controlled by the joint Moroccan-Spanish appointed Jalifa, who leads the Makhzen, a government of the indigenous Riffians and Moroccans from Tétouan. The Makhzen is again divided into departments of cadis, who run the administration in areas not under direct Spanish rule. However, the current Jalifa Moulay al Hassan Ben el Mehdi, seeing the weakening colonial order, has started to exercise more and more political power on his own, emboldened by the High Commissioner’s plight. The Jalifa has for years acted as a sort of check to the Sultan in Casablanca, with him being a monarch for the Spaniards to justify the existence of the protectorate, even if many Riffians feel a longing to join the larger Moroccan state. If the Jalifa starts getting ideas and delusions of grandeur about his position in the Rif. While he holds little actual power, the local Regulares, Tiradores and Indigenous Police could be lured to support him if he were to openly challenge the Spanish rule. High Commissioner Varela, as a rather authoritarian man conscious of his duty to maintain order in the protectorate, has been watching these developments with concern, and with the help of the emergency cabinet, several plans have been drafted to put an end to the Jalifa’s insolence. The more aggressive faction, made up of younger officers from the Spanish Legion, such as Manuel Díaz Criado, supports cracking down on the Jalifa’s ambitions by completely dismantling the Jalifa system and putting all its responsibilities under the High Commissionary and subsequently, the Spanish colonial departments. The more moderate faction, supported by colonel Oswaldo Fernando de la Caridad Capaz y Montes, suggests that we negotiate with the Jalifa, giving him slightly more oversight on Moroccan matters in exchange for loyalty, with a threat of a crackdown if he fails to comply. Varela generally leans more towards Díaz’s suggestion, but the High Commissioner is open to both approaches nonetheless. "
RIF.9.a:0 "Go with Díaz plan."
RIF.9.b:0 "Go with Capaz plan."

RIF.10.t:0 "Tétouan Revolt"
RIF.10.d:0 "Early in the morning, three companies of Spanish-led Regulares marched down the streets of Tétouan, badges, epaulettes and bayonets gleaming in the morning sun. The citizens of the city were woken up to loud orders and the rhythmical thumping of boots as the Spanish Army of Africa made its way to the Jalifa’s palace. The companies, led by captain Manuel Díaz Criado, set in formation before the palace, and upon completion of these maneuvres, Díaz himself climbed the stairs, making an announcement to the gathered soldiers and curious outlookers that the authority of the Jalifa was to be dismantled, the Makhzen closed down and various administrators and local officials brought under the rule of the Spanish High Commissioner Varela. The Jalifa Moulay al Hassan Ben el Mehdi, alerted by the ruckus, demanded to know what had caused such an insult towards the traditional structure of the protectorate, but he was only met by a squad of Regulares who arrested him and various other high-profile members of the court, who were subsequently dragged off the palace by their countrymen serving other masters. However, as the column of soldiers was leaving the city, they were ambushed by a hastily arranged group of civilians, local police and a few Regulares units as well as a small worker’s militia loyal to the Partido Reformista Nacional and al Muslihun groups. The gathered opposition demanded the release of the Jalifa and the return to Moroccan rule, but the situation soon turned ugly after Díaz Criado ordered his forces to disperse the crowd. Shots were fired by both sides, the advancing Regulares were peppered with stones, bricks and rotten vegetables and the streets soon dissolved into utter chaos as the Spaniards and Jalifa loyalists clashed violently. In the midst of the battle, a group of rebel Regulares managed to defeat the Spanish guards of Jalífa el Mehdi and freed him, with the groups fleeing the scene as further escalation of the chaos occurred all around them. The Regulares, due to their superior training and experience, managed to defeat the ambushers after heavy losses, but with the Jalifa on the run and the republicans clearly on his side, the conflict in Tétouan had only just begun."
RIF.10.a:0 "How did they manage to let him escape?"


RIF.11.t:0 "Tétouan Placated"
RIF.11.d:0 "The city of Tétouan had been slipping from Spanish control for quite some time now, and while the local garrison still held the ultimate power in the area, local Spanish officers were rather anxious about the recent moves that Jalifa Moulay al Hassan Ben el Mehdi had been making over the last few weeks. Ever since the isolation of Northern Morocco from the rest of Spain, el Mehdi had been creating alliances and bribing colonial officers for support, and his grip on the city was becoming unchallengeable. However, after colonel Fernando de la Caridad Capaz arrived to negotiate with the Jalifa, these political moves came to an end, for the most part. Capaz, being a moderate man and long-time military leader, had little interest in large schemes or further infighting among the Spanish protectorate’s administration, and had been rather diplomatic about the use of force should the Jalifa attempt.\n\nIt was less so the threat of force and more the promises of further autonomy and administrative freedom that finally placated the Jalifa, and while his loyalty was still nowhere near unquestionable, Capaz’s mission had at the very least prevented one less threat to the protectorate’s regime. Of course, should Spain recover from the terrible civil strife that had overtaken it, the question of Riffian autonomy may very well end in a far less pro-local policies given that Capaz had little actual say in Spanish colonial policy, but this was a bridge to be crossed at a later date. For now, all that mattered was the squashing of Abd el-Krim’s rebellion, and having a semi-loyal Tétouan was certainly a victory in itself. "
RIF.11.a:0 "A schemer on our side is a lot better than one on el-Krim’s side."

RIF.12.t:0 "Question of the Canary"
RIF.12.d:0 "The archipelago of Canary Islands is an integral part of Spain, and while it once may have housed an indigenous population of its own, the Guanches have long since disappeared to the sands of time, assimilated, destroyed or exiled by European colonists. As such, compared to Rif, it possesses few groups aiming to destabilize Spanish rule, but in these dark times, even the smallest dissident group may cause untold damage if left unchecked.Groups such as Frente Único Revolucionario and Partido Nacionalista Canario are filled with dangerous separatists and Canarian nationalists, and while fringe in the grand scheme of things, the war on Spanish soil has shown that the threat of minority nationalists is one that should not be overlooked.\n\nThus, the protectorate administration has suggested that the Protectorate of Spanish Morocco annexed the Canary Islands under its own governance for as long as the Spanish strife is on-going, as the local garrisons in Las Palmas and Tenerife are wholly insufficient in present time to stop an island-wide insurrection. The local governor, Amado Balmes Alonso, has been informed of such plans, and while hesitant to give up his authority, has expressed some degree of interest given the meagre resources he has to work with. However, the decision on whether to go ahead with the plan or not lies with High Commissioner Varela. "
RIF.12.a:0 "The islands need our protection."
RIF.12.b:0 "We have enough on our plate as is."

RIF.13.t:0 "Reforge the Pact of Rif?"
RIF.13.d:0 "The war against Abd el-Krim is a near repetition of what occurred in the mid-1920s against the same rebellious Riffians, but this time, the colonial garrison of the Spanish protectorate has no support coming from the mainland. With Spain in turmoil, we must sustain the war support on our own or perish to the bloodthirsty savages of el-Krim. Or so it would seem, but perhaps it must not be the case. The French National State on our western border helped curtail Abd el-Krim’s rebellion the first time as well, and while the state under Marechal Petain has far more to deal with today, given the rather precarious situation in Europe and increased calls among the French exiles to reclaim their birthright on the continent, it is nonetheless in the best interests of the Algiers regime to destroy el-Krim’s rebellion again before he inspires further tribal rebellions among the Berbers and other African tribes under French rule.\n\nAs such, we could send a diplomatic mission by sea or air to Algiers in hopes of receiving industrial, military or political support from the regime there, given the similar aims of our two nations. Some officers, especially among the younger cliques of the army, are rather disinterested in the plan, however, claiming that it would merely make us lapdogs of the Frenchmen. "
RIF.13.a:0 "Send the envoy, we need all the help we can get."
RIF.13.b:0 "The young officers are right, we do not need help from these exiles."

RIF.14.t:0 "Reforge the Pact of Rif?"
RIF.14.d:0 "An envoy from Ceuta arrived earlier today to Algiers, representing the rump colonial regime of the Spanish protectorate of Northern Morocco. Speaking on behalf of the colonial High Commissioner, José Enrique Varela Iglesias, the envoy requested aid from the French National State in the quelling of the revolt of Abd el-Krim, the Riffian rebel who already threatened Spanish colonial rule in the mid-1920s and was only crushed after the intervention of the French exiles. This time, the Spaniards are not requesting a full intervention, but merely help with either some additional troops or with industrial matters.\n\nThe situation does concern our regime as well, given that Abd el-Krim is committed to the cause of Berber liberation and in the past sponsored rebels among the French colonial army to support this aim. He is also an ally of the Cairo regime, and thus a threat to French colonial ambitions in Africa. Still, the remaining Spanish administration in the Rif is constantly under siege from various enemy groups, and some within the French government fear that giving them resources at this time would simply hand those weapons and industrial aid to Moroccan rebels. "
RIF.14.a:0 "Give them men to fight the rebels with."
RIF.14.b:0 "A small boost to their industry is hardly unnecessary."
RIF.14.c:0 "This is not worth our time."

RIF.15.t:0 "French Volunteers Arrive!"
RIF.15.d:0 "Earlier this morning, French volunteers from Algiers, Oran and Constantine arrived at the ports of Ceuta, Melilla and Tangier to fight alongside the loyal men of the Spanish Protectorate of Morocco. With their help, we may finally have the edge needed to defeat the rebels of Abd el-Krim. "
RIF.15.a:0 "To our friends in Algiers!"

RIF.16.t:0 "French Support Arrives!"
RIF.16.d:0 "Earlier this morning, French experts and industrial aid from Algiers, Oran and Constantine arrived at the ports of Ceuta, Melilla and Tangier to help with filling the gaps in the industrial machine of the Spanish Protectorate of Morocco. With this help, we may finally have the edge needed to defeat the rebels of Abd el-Krim. "
RIF.16.a:0 "To our friends in Algiers!"

RIF.17.t:0 "French Support Declined!"
RIF.17.d:0 "Despite the dire situation we find ourselves in, and the grave consequences our fall would mean for the Algiers regime, the French National State has declined to support us in the on-going war against Abd el-Krim. We will have to defeat him on our own. "
RIF.17.a:0 "The perfidious Frenchmen can never be trusted, it seems."


RIF.20.t:0 "First Elections of the Rif Republic"
RIF.20.d:0 "With the victory over Spanish now clear, the Rifian republic can finally breathe free, saved from the colonialist tendencies of the Europeans by the brave hands of the Harakas and rough tribal warriors of the Atlas mountains. Now, the time has come to hold the first truly free elections of the Rif Republic, much to the surprise of many. Abd el-Krim has never been a man of strong democratic convictions, but in the face of increasing pressure from his allies in Cairo and Internationale, as well as domestic supporters, he caved in and promised free elections to solidify his rule. It is expected that the war hero wins the elections, but this is hardly certain given his low popularity among urban populations. The most ideologically opposing party to his is the Partido Reformista Nacional, led by Abdelhadek Torres, which espouses a vaguely socialist, Pan-Arabist and highly modern form of republicanism.\n\nA more moderate alternative is the al Muslihun group, led by Mohammed Daoud, which aims to create a more intellectually modern republic with a focus on co-operative development and thorough reformation of all institutions in the region. In the centre of Riffian politics alongside Abd el-Krim’s movement is the Partido de Unidad Marroquí led by Mohammed al-Makki al-Nasiri, supporting a reunification with the Moroccan sultanate, reformist and anti-conservative changes to the republic and curtailing of the power of the Muslim Imams. Finally, to oppose the party of Abd el-Krim, the former Jalifa has decided to run in the elections on a monarchist, progressive conservative platform aimed at reconciling with harmless Spaniards and returning to the Makhzen system of governance, though his support remains relatively minimal."
RIF.20.a:0 "al Muslihun wins."
RIF.20.b:0 "PUM wins."
RIF.20.c:0 "DAR wins."
RIF.20.e:0 "Jalifa wins."
RIF.20.f:0 "PRN wins."

RIF.30.t:0 "Son of Zinat at the Gates of Ceuta"
RIF.30.d:0 "The Spanish garrison of Northern Morocco had returned to its strongholds in the region’s towns and cities to lick their wounds following the humiliating defeat against the bandits of Mulai Ahmed er Raisuli. However, as days went by and the army returned to its strength, the desire for vengeance grew as well. High Commissioner José Enrique Varela and his subordinates had planned a general offensive throughout the region with the aim of rooting out the troublesome bandit king, and the entire might of the Spanish Legion and Regulares had mustered to the banner of the general. As more and more troops arrived to the garrisons in Ceuta and Melilla, the sting of the recent defeat faded and a newfound sense of military might rose to its place. Columns of Spanish troops and Moroccan militias left the safety of the cities in the early hours of the day, seeking to crush the bandit king’s realm high on the Atlas mountains.\n\nHowever, as the last legionaries left the city of Ceuta, two steamers barreled into the city’s port under the flag of Morocco, a common sight in the busy town. The port personnel hurried to receive the ships, but as the ships lowered their anchors, hordes of Riffian tribesmen burst out from the innards of the vessels and ravaged any resistance on the harbour grounds. It would not take long for the Spanish army to notice the chaos going on in the city, as smoke clouds rose from the burning buildings of Ceuta, and the army of the High Commissioner turned around in a hasty manner to relieve the beleaguered city from the seaborne raiders. As the Spanish troops rushed towards the city, they found themselves locked in an ambush as highwaymen of er Raisuli appeared to crawl out of the very ground with murderous intent, cutting down Bridegrooms of Death and Moroccan Regulares alike with their outdated but lethal rifles.\n\nWhat had been an orderly march mere moments ago had turned into a true bloodbath, as the honour guard of er Raisuli joined the battle on horseback and cut through the ranks of Varela’s men. The final survivors of the leftover companies of the Spanish Legion made a determined push to the very centre of Ceuta, fighting the original pirates who landed in the harbour. Outside, the Regulares began to strike down their ambushers one tribal warrior at a time, but the fighting was a bitter attritional exercise all the same. With the entire battlefield covered in smoke from the rifle barrels and grenades, few could really tell which side was winning, and as sabres clashed and guns barked, the battle dragged on until its inevitable conclusion, one side emerging victorious from the smoke.."
RIF.30.a:0 "The cunning pirate king, er Raisuli, breaks the Spanish hold on Rif!"
RIF.30.b:0 "The bandit king is slain and his army breaks into rout, giving Varela his victory!"

RIF.32.t:0 "The Siege of Tétouan"
RIF.32.d:0 "Warfare in the Rif region was among the harshest seen in the entire world, with unforgiving terrain, inhumane weather conditions, rough and doggedly resistant local tribes and few opportunities to maintain supply from the land itself. Every movement of the large armies had to be a carefully crafted exercise, as was best evidenced by the Disaster of Annual more than a decade ago. Strategic necessities in the region meant that sometimes a force had to leave considerable gaps within its lines in order to better move men and materiel around for a push or defensive action in some other part of the line, and rarely, even entire settlements are abandoned by necessity. Nonetheless, as seemingly entire battalions marched out of the city of Tétouan, the entire region was in disarray. Given the recent instability in the Rif territories, local civilians and political organisations saw the Spanish withdrawal as a final betrayal, and Tétouanian political figures such as Mohammed al-Makki al-Nasiri and Abdelkhalek Torres were quick to arrange the formation of militias around the city. However, as news of the rebel forces of the rogue colonel Mohamed ben Mizzian arrived to the urban settlement, the Spanish army returned in the darkness of the night, expelling civilians from their homes and turning them into makeshift pillboxes and blockhouses.\n\nHundreds of Legionaries, Regulares and Harka troops lay in wait for the mutinous Regulares, with only a minimal force patrolling the streets and walls of the city, until one day riders approached from the countryside. The rebels had arrived, and while the sentinels were quick to retreat from the way of the attacking Moroccan rebels, the emplacements within the city dulled the first wave of local rebels. As the battle continued, however, it became clear that the Regulares would not give up easily, and the city was besieged by the entire might of the rebel army. High Commissioner Varela and his small army, however, had anticipated the attack, and were marching to eliminate the Moorish insurgents. As the siege raged on, the second army of the Spanish protectorate reached the gates of the city, only to find them filled with the dead from the Regulares attacks. Confident that the blockhouses had slaughtered the rebels, the army of the High Commissioner entered Tétouan, only to find the weapons of their comrades turned against them. The local militias had turned on their masters, followed by a coordinated attack by ben Mizzian’s forces, and the defenders had been crushed between the two Moroccan forces.\n\nBetrayed and ambushed, the Spanish garrison attempted a fighting retreat under Varela, but found themselves bottlenecked by the city walls, and just as swiftly as the battle had began, it ended with the complete surrender of the local garrison. However, to their surprise, the Spaniards among the ranks of the Commissioner’s army were spared by the locals, for ben Mizzian directed his grievances directly at the head of the protectorate and not the men serving under him. Nonetheless, the Protectorate now belonged to the colonel, and colonel alone."
RIF.32.a:0 "A new dawn for the Rif region."

RIF.33.t:0 "Swooping Claws of the Warhawks"
RIF.33.d:0 "The Rif War of the last decade had been an incredibly bitter affair, leaving most of the region devastated and entire villages destroyed with no inhabitants left alive, and as the Spanish rule had continued, few had harboured hopes of the return of Abd el Krim and the end of the colonial oppressions. But return he did, and as a new rebellion swept across the Atlas mountains, it seemed that the Spanish garrison was doomed with their High Commissioner unable to stem the tide of the rebels. With Rif all but secured in his grasp, the elusive old rebel became more relaxed with his security policies and no longer switched his hiding spot in a weekly basis, and as the Spanish resistance became mostly committed to the few enclaves in Ceuta and Melilla, Abd el Krim seemingly abandoned all fears of a Spanish assassin striking him.\n\nHowever, with victory at their feet, the hubris of the Rif government backfired. In the early light of the morning, three Morane-Saulnier M.S.225 fighters swooped down over the Atlas mountains and struck the command post of the republic in the town of Ajdir, peppering the building with machine gun fire and tossing numerous hand grenades and incendiary bombs to the buildings below. In the chaos, the government attempted to evacuate the burning headquarters, only to be surprised by a force of ragged Spanish army survivors led by a company of Western mercenaries. In the ensuing battle between the distraught government forces and their ambushers, the entire town was engulfed into bitter and confused conflict, with civilians taking up arms from the dead to defend their famed leader.\n\nThe chaos, not helped by the Morane-Saulniers making numerous passes and cutting down reinforcing tribesmen from other positions near the village, soon devolved into hand-to-hand combat, and the true winners of the skirmish could only become known as the smoke cleared and the final gunshots echoed through the clear Riffian air."
RIF.33.a:0 "The mercenary company of Charles Sweeny had managed to pull off the impossible!"
RIF.33.b:0 "The Riffian government managed to avoid the fighting and emerged to rule unscathed!"

RIF.35.t:0 "Swooping Claws of the Warhawks"
RIF.35.d:0 "The treacherous Jalifa, having kept himself hidden for the weeks the Protectorate’s government spent stabilising the realm against the threats of Abd el Krim and Mulai Ahmed er Raisuli, has managed to convince one of the most loyal agents of the Spanish Regulares to turn against us. Mohamed bin Mezzian, the highest-ranking Moroccan in the Army of Africa, has rallied the rebelling Regulares troops around his banner, claiming to uphold the mandate of the Northern Moroccan people under Jalifa Mulay Hassan el Mehdi, and seeing the rule of High Commissioner Varela as increasingly exploitative, he has vanished into the four winds with a sizeable army. Or so it at first appeared to be the case, as now he has returned to the battlefield, striking outposts throughout the Spanish-held territories and using Mezzian’s long history with the many strongholds in the region to plan daring raids. While his ragtag army of local militias and deserter Regulares troops are not a real threat to the might of the Spanish Protectorate’s army alone, the local forces are spread thin trying to curb the rebel activity deep in the Atlas mountains, and the rebellion of ben Mizzian and the Jalifa have called the into question the true allegiances of the locals as a whole. With paranoia and distrust rampant in the ranks of the High Commissioner’s army, there are reports of officers performing summary executions of Regulares soldiers for even the slightest sign of discontent, which has in extreme cases led to mutinies and the lynching of a few Spanish lieutenants at the hands of their supposed subordinates, only for them to later join ben Mizzian’s army. This nuisance must be dealt with, of course, but the question is, how? The colonel’s army is highly mobile and has perfect knowledge of not only local terrain but also the strengths and weaknesses of the Spanish defenses, and while their forces are smaller than those of the High Commissioner’s, the mutineers could prove more than an equal match in an asymmetrical engagement. General Varela generally seeks to employ a strategy of thinning the rebel numbers by reinforcing smaller outposts and sending cavalry troops into areas with heightened Regulares activity, as the colonel lacks the means to pursue a true siege campaign and his forces are primarily infantry that could be run down by the cavalry troops in open terrain. However, colonel Amado Balmes Alonso has suggested luring the forces of ben Mezzian into the city of Tetouan, the original point of their rebellion, with the hopes that it would allow for a swift defeat of the entire mutiny in one fell swoop."
RIF.35.a:0 "Varela’s attritional strategy is the best."
RIF.35.b:0 "Urban ambush as per Balmes’ plan is definitely the decisive approach."


RIF.100.t:0 "Between Burgos and Madrid"
RIF.100.d:0 "the 10 riffan divisions that will go to whichever side we support will be thrilled to hear this news"
RIF.100.a:0 "We are loyal to the kingdom, now and forever!"
RIF.100.b:0 "We are loyal to the Burgundian Cross!"

RIF.212.t:0 "Revenge of the Barbary Corsairs"
RIF.212.d:0 "Sultan Mulai Ahmed er Raisuni is no stranger to international intrigue, but by far his most daring feat was the capture of one Ion Perdicaris, a Greek-American citizen living in Tangier, as well as his son Cromwell Varley and Perdicaris’ wife, in 1904. Following the kidnapping, Raisuni caused an international incident well beyond anything he had expected, as he had demanded the Moroccan sultan and great rival of the Sharif, Abd al-Aziz, for the control of certain regions of Morocco as well as a tribute of money and the protection of the British Empire in exchange for the prisoner. However, the rising power United States saw the situation as both an international event that could show their increasing naval might as well as a domestic rallying cry for the president hopeful Theodore Roosevelt.\n\nSeven vessels of varying displacement and armaments from the American navy made their way from one side of the Atlantic to the other, accompanied by British, French and Spanish military vessels. Eventually the Moroccan sultan was forced to yield to the pressure, conceding to Raisuni’s demands in exchange for the prisoner, though Perdicaris had began to be quite fond of the bandit king and considered him a patriot far more than a brigand. Nonetheless, the entire debacle was blown out of proportion by the Roosevelt campaign team, and to this day it represents yet another example of the Americans meddling in Moroccan affairs.\n\nWhile it is true that American pressure earned the Sharif his ransom, the new Sultan has little fondness for the Americans, for as the titular last Barbary pirate the Sultan considers the Americans to be little more than imperialist interlopers who originally destroyed the power of the Barbary corsairs for their own benefit and to this day seek to impose their order on the Moroccan people. After all, even during the Rif war, it was American mercenaries who bombed Riffian children from their planes in the sky, safe from retaliation. The Americans have been thoroughly punished in recent years, but as Raisuni’s new empire rises and the United States teeters on the edge of collapse, some have suggested that perhaps the Barbary pirates could get the last laugh and bring about or hasten an American century of humiliation."
RIF.212.a:0 "Unfurl the sails and load the cannons, we set sail for Washington!"
RIF.212.b:0 "Tempting, but we cannot lower ourselves to the level of the American imperialists."

RIF.215.t:0 "The Usurper’s Price"
RIF.215.d:0 "After the rise of Mulai Ahmed er Raisuni to reign over the lands of the Rif once more, it was only a matter of time when he would face the pretender Sultan in Morocco proper. The war has now come to an end, the fortresses of Mohammed V are ablaze and his forces are scattered to the four winds, and while he may have expected the Germans to be his salvation, such help was not forthcoming. With the Sultan slain, his government destroyed and the German treasures plundered from his opulent castles and vaults, the Sultan of the mountains has proven himself to be the unquestionable ruler of these lands. Morocco is, for the first time in centuries ever since the conquests of Spaniards, French and lately, the Germans, a free nation once again, and its liberators have come from a very curious source, as the ancestral home of the Moroccans, the mighty Atlas mountains, have once again provided the muscle, courage and blood needed to free the land from foreign oppressors and their lackeys.\n\nHowever, now that the Raisuni dynasty is firmly in control of not just Northern Morocco but also South Sahara and the heartland of the region, such as the states of Casablanca, Rabat and Marrakech, the question has been raised on where the new Sultan shall settle his reign. While it is certainly true that Mulai Ahmed er Raisuni’s true home is within the boundaries of the Atlas mountains, and he has little regard for the servants of the former sultan of Morocco, these folks that have for so long been under the yoke of the French and German alike are still his people, and now look up to the Sharif for guidance and wisdom as the region enters the dire straits of post-colonialism.\n\nAs such, members of the great leader’s inner council have noted that Raisuni should move his capital to Casablanca officially, cementing himself as the new liege of the realm and ensuring that no warlord or Pasha with considerable influence dares to threaten his new regime in the former territories of Morocco. Nonetheless, Raisuni himself feels more closely tied to the Rif region, and it will forever be the citadel of his power, which has led many within the Sultan’s government to argue that the Sharif should retain his reign within the halls of the House of Tears. Some have also suggested adopting the old capital of Morocco, Rabat, as the new house of Moroccan governance, while some suggest that the city of Fez is the best option given its proximity to Rif and its scholarly nature due to the local universities and madrassas"
RIF.215.a:0 "We shall remain in our ancestral home."
RIF.215.b:0 "Casablanca shall be our new seat of power."
RIF.215.c:0 "The old capital of Rabat shows our adherence to tradition."
RIF.215.e:0 "The university city of Fez keeps us close to our roots."

RIF.216.t:0 "His Cousin’s Keeper"
RIF.216.d:0 "The capabilities of Sultan Mulai Ahmed er Raisuni are very much fitting for the legendary annals of history, but for all his prowess as a wise authority and statesman in Northern Morocco, his power would not reach from the edges of the Atlantic ocean to the shores of Mediterranean if not for learned men in his close counsel. One such individual is his cousin Mulai Sadiq, a man very much understood as the antithesis to the Sharif. Whereas the Sharif was a man of immense experience in war and statecraft, Mulai Shadiq is an alim through and through, preferring to eschew worldly sensations and etiquettes for the sake of learning. During his campaigns against Spain in the 1910s and 1920s, Raisuni did not have Sadiq within his government, for the scholar much preferred to dive deep into his ancient tomes and learned the wisdom of nearly a millennia of Muslim scholars from all around the Arabic world.\n\nHowever, like the Sultan himself, Mulai Sadiq is an old man, and despite his tenacity and impressive resilience in the harsh climate of the Rif region, as well as the instability in his native home of Tétouan where the learned man holds his court, Mulai Sadiq has chosen to leverage his considerable knowledge of the world and its wonders for the sake of his cousin’s governance, joining the Sharif in the House of Tears to lead Rif towards greatness. His importance has been especially pronounced on the eldest son of Raisuni, Mohamed Khalid, whom Mulai Sadiq has acted as the teacher for, given his immense knowledge and abilities as a storyteller.\n\nIn fact, there are hardly men more well-versed in the many legends, myths and events of Raisuni’s life than his cousin, and while it is customary that Muslim Sultans and other great men only have their lives detailed long after their era as rulers has come to an end, Raisuni has allowed Sadiq to retell some of his cousin’s adventures to the academians and historians of Tétouan for the sake of building a foundation for the dynasty of the bandit king. Mulai Sadiq has been especially important in creating connections between the governance of the new Sultan and the former allies of the Jalifa in Tétouan, integrating many members of the former administration into his court to assist in matters related to the running of the young state, though he is often seen delving deep into his tomes for guidance in matters."
RIF.216.a:0 "Every regime needs its scholars too."

RIF.217.t:0 "Benevolence of the Bandit"
RIF.217.d:0 "The Spanish reign over Northern Morocco was hardly a particularly fondly thought of by the locals, though for the local Jewish population it was a sight of relief. While it had indeed been the case that it was the Spaniards in 1492 who had driven the ancestors of these Riffian Jews ainto the lands of Africa, many local leaders of the faith saw the Spaniards as more benevolent masters. Despite the wealth of the local Sephardic communities, they were regarded as subjects by the Muslims Moroccans. Many rules were in place to enforce this, such as the fact that the local followers of Yahweh had to take off their shoes off when walking on a street with a mosque, and were not allowed to sit in the presence of a ulema.\n\nPerhaps the gravest form of supremacy the Arabs showed towards the local Jews however was in economic terms, for it was not uncommon for various strongmen to visit the accommodations of Jewish Riffians, demanding charity as a form of tribute. If the Jewish person being heckled was not quick enough with the opening of their purse, the action was often hastened with a few blows to the skull. However, with the Spaniards gone, the Riffian Sephardics have been weary of a return to these ‘traditions’, yet as the grand helmsman of the region, Mulai Ahmed er Raisuni has outright banned such violent economic transactions. The Sultan has reinforced his point with the words of Prophet Muhammad, saying that just like the holiest man of his faith, Raisuni had come not to destroy, but to construct.\n\nHarsh punishments are leveraged on those who carry out such cruel attacks, and Raisuni has claimed that just like Prophet Muhammad, the Riffians should simply embrace the good parts of every religion and discard the bad. With the defeat of the Spanish garrison, the region now belongs to the local Arab population once more, but Raisuni aims to ensure that it does not fall for the barbarity of the past again. This is especially important given the large Spanish minority these lands still hold, and the various groups of immigrants from all over the world practicing various faiths in places like Ceuta and Tangier. Islam shall obviously remain the supreme guiding line in Raisuni’s new state, but sectarian violence must be curtailed by the order of the Sharif."
RIF.217.a:0 "A new era of peace in the Rif region."

RIF.218.t:0 "Death of the Sharif"
RIF.218.d:0 "The legend of Mulai Ahmed er Raisuni, Sultan of the Mountains, last of the Barbary pirates and greatest thorn in the side of Spain, is a long and storied one, and in the brief period since his return from exile, the bandit king has managed to write a few more chapters to his personal saga that rival even the drama of the Perdicaris affair or his exploits during the Rif war. His many rivals, such as those of the Moroccan sultans, the Spanish colonial troops, the Jalifa of Tétouan and the low-born rebel Abd el Krim, have all been vanquished, and the Sharif stands supreme as the one true ruler of not just Morocco and the Rif but as one of the rising powers in all of Maghreb and beyond. However, even a man who has achieved so much and forged an empire as vast, prosperous and strong is only a man in the end, and for all his wealth, there is no amount of gold or great gifts that in the end are capable of buying more days in the lives of mortals.\n\nThe Sultan has met his end within the walls of the House of Tears, a palace he fought hard to reclaim and eventually restored to the glory it had possessed before being conquered, pillaged and defiled by the Spaniards. Plagued by old age and the illnesses and ailments that accompany it, the Sharif met his death with grace and surrendered to the great reaper of souls, confident in the belief that he had done all he could for the people of the Rif. With the venerable Sultan dead, a new eagle of Zinat shall soar unto the skies of the Atlas mountains, for the eldest son of Mulai Ahmed er Raisuni, Mohamed Khalid, shall inherit his father’s throne as Mohamed Khalid I.\n\nAccompanied by the close allies of his father in these new tasks of governance, the young Sultan of the Mountains shall inherit a realm with a large fleet of privateers, an army of fierce bandits and warriors and a nation of pious and brave Riffians, well-suited to reach completely new heights that even his venerable father did not dream of reaching towards. The long tale of Mulai Ahmed has come to an end, but the legacy of the bandit king lives on in his offspring, and in time, the Raisuni dynasty may come to rival the Sultans of old in the Moroccan history."
RIF.218.a:0 "The Sultan is dead, long live the Sultan!"

RIF.219.t:0 "Trouble in Terrorist Town"
RIF.219.d:0 "Had one visited the city of Tangier before and after the collapse of the Protectorate of Northern Morocco, they would have found a city with two natures completely flipped on its head. Once the home of an international council with representatives from not just Europe but also the Americas, Tangier was a shining pearl on the African coast, creating business opportunities, venues for diplomacy, inspirational muses for artists, and adventures for the tourists around the world. Ever since the Riffian takeover of Mulai Ahmed er Raisuni, the city no longer draws in these crowds for the most part, as the European consulates were completely ransacked, the haciendas of the tourists turned into holiday homes for Raisuni’s loyal lieutenants and the ports that once brought in cargo from around the globe have been transformed into dens of corsairs and buccaneers. The city that once served as the home for shady business, white collar crime, money laundering and various banking schemes made with clear support from European financial sectors, has now become a true hideout of Atlantic privateering, Moroccan banditry and various other forms of far more direct and violent criminal activity.\n\nHowever, for a fugitive such as the treacherous general Dris er Riffi, the city was the perfect place to lay low and look for the first boat out of his nemesis’ new fiefdom. However, while the Spanish collaborator may have had the best chances of escape in the city, the instability of Tangier made it so that the vessels that could have guided him to safety were stuck in a port that the Spaniards had made impossible to escape from. A Spanish cargo ship had been sunk in the harbour, blocking the main way out of Tangier. While it has been blown up numerous times, only recently did the rowdy band of pirates get the Spanish ship to truly sink to such degree that a proper vessel could pass over it. The spirit of escape for the general was tangible now, but just as he was climbing on board of the steamer destined for Lisbon, a squad of heavily armed warriors of the Sultan clambered onto the pier.\n\nSeeing the writing on the wall, Dris er Riffi drew his Astra sidearm and opened fire on his would-be captors, but after one of the soldiers fell, his comrades returned in kind and the great nemesis of the Sultan met his end in a hail of bullets. Torn asunder from bursts fired by half a dozen submachine guns, Dris er Riffi plunged down into the cold Atlantic waters, becoming one more lost soul in the vastness of the ocean."
RIF.219.a:0 "A fitting end for a traitor."

RIF.220.t:0 "The Christian Sharif"
RIF.220.d:0 "When a man has waged a war against a group of people for decades, many such warriors become completely immune to the killing of such folk. All they see is an enemy that remains a roadblock, as it has been for much of their lives, and the destruction of that roadblock can become a permanent goal of their life. However, while the bandit king Mulai Ahmed er Raisuni has certainly spent much of his life fighting the Spaniards, and has had to ensure prison, grievous wounds, harshness of the mountains in his exile and the betrayals of his close allies as they have been lured into the trap of servitude to the Iberians by promises of power and gold, Raisuni has always tried to remain at least on somewhat good terms with the Spaniards. What happens in a war is a matter between the warriors, but in diplomacy, Raisuni has tried to avoid the pitfalls of endless feuds with the servants of Madrid, and while partially this is due to pragmatism, it would be foolish to claim that this respect for the Spaniard did not also come from a personal relationship Raisuni had with the Spanish consul Zugasti, who lived in Tétouan before his recalling back home to the peninsula.\n\nZugasti was not a warrior in the traditional sense of the world, and was adamant in his support for the coexistence of Arabs and Spaniards, going as far as to never carry a weapon on him outside of long trips where one may encounter highwaymen, as Zugasti insisted that only through showing trust in the locals could the Spaniards gain their trust in turn. However, when the time came for action, Zugasti would earn respect through his fearlessness, and no act earned him as much fame as the sinking of a cartridge ship in the port of Luccus. The ship had caught fire, but the crew were resting and did not notice the fire until it had already spread to such degree that many chose to abandon the ship. Locals were stirred into hysteria as they considered the ship close to the point of explosion, but Zugasti acted with the courage of a lion. He ordered a local policeman to hand the consul his service revolver, and armed with the weapon, ordered some of the fleeing sailors to row him to the burning ship.\n\nWhile on board, Zugasti managed to guide the crew into sinking the ship, saving the men on board as the flooding water extinguished the hungry flames mere moments before a catastrophic eruption could have killed not just the sailors but dozens in the nearby settlement as well. For this act of bravery, Zugasti earned the nickname Christian Sharif, and throughout his stay in the Rif, he worked closely with Raisuni to keep the region from turning into a powderkeg, though the two ultimately failed. While the man no longer lives in the region, his legacy has made Raisuni far more mellow on the remaining Spaniards than he may otherwise have been."
RIF.220.a:0 "Even the Spaniards have their good apples."

RIF.221.t:0 "Conflict with the Ceutan Colonials"
RIF.221.d:0 "When the first columns of Mulai Ahmed er Raisuni’s’s troops crossed over into lands of Ceuta and Melilla, to say that the visit was not a welcome one would be an understatement. Fernando López Canti, the last Spanish mayor in the city of Ceuta, had managed to organise a network of remaining Spaniards into acts of resistance, as the city was largely controlled by them to this day due to the long history of the settlement under Spain’s control and the large migration of people from the metropole to the colony through Ceuta. When Sultan Raisuni’s avalanche of bandits, warriors and pirates descended from the mountains and conquered the Rif region back from the bootlickers of Spain and the deluded nationalists of Abd el Krim, Ceuta had been one of the last bastions under the control of the Spanish Legion and colonial police, and the streets had ran red with the blood of civilians and soldiers alike when Raisuni destroyed his final foe.\n\nHowever, while the city was now under the control of the Arabs once more, it was far from peaceful, and as the enforcers of the Sharif’s will began to hunt for the traitorous snake Dris er Riffi, they found themselves peppered with rocks, bricks and rotten fruit. However, when the first gunshots began, the city turned into a miniature battleground as few remnant squads of Spanish Legionaries, criminals and guerilla fighters opened fire on the warriors of the Sultan. The Riffians had come prepared, and armed with looted submachine guns from various armouries around the Rif region, they soon decimated the pockets of resistance, slaughtering any man who chose defiance in those crucial moments.\n\nNonetheless, when the final echoes from the barks of the guns and the smoke began to waft upwards into the bright sky, the warriors combed through the bodies for the carcass of er Riffi, ultimately to no avail. Ceuta had been a dead end, and as news of the massacre would spread to other regions, it would become impossible to discover the location of the fugitive once more. At the very least, the final cells of Spanish resistance in the city had been wiped out, but the overarching quest of the Sultan’s men had gone unanswered."
RIF.221.a:0 "One less den of vipers, but the head of the snake lingers in this world."

RIF.222.t:0 "Tumultuous Times in Tétouan"
RIF.222.d:0 "The agents of the Sultan spent the better part of a day combing whatever guest houses or shelters there were to be found in the city of Tétouan, but to little avail. Members of the Sultan’s enforcement arm went through the markets, bazaars and cafes of the bustling seat of government as well, asking passers-bys for information on the runaway general Dris er Riffi, and while occasionally someone would recognise the man, or at least claim to do so, these wild goose chases ended up being little more than fruitless pursuits on the tails of spectres and shadows. Given the status of Tétouan as the administrative capital of the Jalifa’s government, there were quite a few faces familiar to the enforcers of the Sharif, and often enough the main hunt for er Riffi had to be paused momentarily to snatch up one of the Spanish sympathisers before they could flee and help other similar traitors.\n\nIn one such case, the information given by a local led the troops of Mulai Ahmed er Raisuni into an ambush, with a small group of Spanish loyalists attacking the brave tribal warriors of the Rif on the narrow streets of the town, only to be slain in the ensuing firefight and melee. The interrogated Spaniard survivor did reveal that they were part of a small rearguard meant to help Spanish officers and soldiers as well as important collaborators escape into various coastal towns and port cities. While the true extent of this trail of traitors remains shrouded in mystery and the great nemesis of the Sultan of the Mountains is still at large, at the very least a section of the Spanish escape route is now cut off from the rest. Nonetheless, Dris er Riffi most likely is already out of Northern Morocco, possibly en route to Casablanca, Algiers or Cadiz. The trail has gone cold, for now."
RIF.222.a:0 "Unfortunate, but such is the nature of these manners."

RIF.223.t:0 "The Other Nemesis of er Raisuni"
RIF.223.d:0 "One of Sultan Mulai Ahmed er Raisuni’s greatest regrets from his original war against Spain was his inability to execute the traitor Driss er Riffi, or as he is currently known, Haj Driss Riffi Temsamani. Driss er Riffi was originally one of er Raisuni’s trusted warriors and generals, leading the Sharif’s troops against feuding Riffian tribal lords as well as the Spaniards trying to push their empire into Africa further and deeper than ever before. However, wooed by the lucrative offers of the Spaniards, er Riffi left the noble cause of Raisuni to join the occupiers and plunderers of Morocco, becoming a mere pawn in the colonial machine of Spain. However, his treachery did not end there, for er Riffi tried to spread his personal failings to other officers within the forces of the bandit Sultan, offering them gold, high positions and other impressive perks if the generals, tribal commanders and regional governors of the Sharif would rescind their loyalties to the Raisuni family and join Spain alongside him.\n\nNone did, however, and er Riffi found his efforts useless, which made the disgraced general turn to violent means in the service of his masters, arranging the death of one of Raisuni’s most loyal servants and even going as far as to arrange a meeting with the Sharif himself only to bomb his home in the process. Raisuni had anticipated such treachery from the man who had already forsaken his master once, and had thus steered clear of the meeting, and in the aftermath of the entire debacle, the Spaniards decided to incarcerate the dishonoured general to appease Raisuni in order to achieve peace. Ultimately all such attempts to find a lasting peace in the Rif failed, and even now, decade later, Spain and the Sultan of the mountains remain at war. Er Riffi, however, has still managed to avoid punishment to this day, but for not much longer. With the colonials pushed out of the region, Raisuni is determined to find his old nemesis and finally gain his payback from the traitor, but the question remains on where to look.\n\nThe remnants of Jalifa’s administration, who have recently joined Raisuni’s governance, suggest that he could be in Tétouan, using the large city with substantial Spanish support base to hide in, though some have noted that Tétouan is simply too crowded with the various democrats and their pro-Moroccan biases for such a prominent collaborator to hide in. Others, such as Mulai Sadiq, Raisuni’s old advisor, claims that the most likely hiding place for er Riffi is the bustling city of Tangier, for the international nature and weak control the Sultan exerts on the settlement makes it a logical choice for the fugitive. Finally, while most unreliable, a smattering of captured Spanish soldiers from various garrisons around Northern Morocco have noted that the general on the run could be hiding in Ceuta or Melilla, given his close relationship with the Spanish remnants, though how trustworthy these men are is dubious at best."
RIF.223.a:0 "Tétouan seems like the best bet."
RIF.223.b:0 "Tangier is a famed hub of fugitives, look there."
RIF.223.c:0 "Such a bootlicker of the Spaniards is bound to be in their remaining enclaves."

RIF.224.t:0 "Heir to the Empire"
RIF.224.d:0 "Even the greatest men to ever walk the Earth had to succumb to the passage of time eventually, and the empires they built suffered for it, turning into ash just as their founders either right after their passing or centuries later when the name of the original leader had long passed into legend. So too, must Mulai Ahmed er Raisuli acknowledge his own mortality, and the bandit king probably realises it better than most, having long suffered from various ailments, most notably dropsy, which nearly claimed his life in the 1920s. Raisuni’s survival added greatly to his personal mythos, and while his long life is considered miraculous by many, the Sultan is not deluded enough not to understand that his final days are nearing fast.\n\nAs such, he has placed great care into making sure that his eldest son, Mohamed Khalid, is prepared for the trials of statecraft. Thankfully, the young man has been present for various meetings between Raisuni and his subordinates, enemies and foreign allies, and has learned a great deal since his childhood, even participating in quite a few discussions Raisuni had with the famed journalist and adventurer Rosita Forbes. Nonetheless, Raisuni has ensured that both the boy’s cousin, Mulai Ali er Raisuni, former governor in one of the cities in the bandit king’s realm, as well as the venerable elder Mulai Sadiq are prepared to guide the heir to Raisuni’s empire to greatness. They will also be vested with the burden of administrating the vast empire of er Raisuni in the first years since the Sultan’s passing if the heir does not consider himself ready for the task, as the Sultan’s realm requires a government of decisive action and firm hand to remain intact against the many internal and external enemies it possesses.\n\nMohamed Khalid has already proven himself a capable warrior, guiding the Sharif’s troops on numerous occasions during the battles against Spain and Abd el Krim, but his forays into administration and governance have been sporadic and short, an unfortunate reality brought about by Raisuni’s exile and the subsequent instability and infighting in his new confederation. Nonetheless, with the backing of Raisuni’s trusted family members and political allies, the future Sharif of the Rif will have all the tools needed to push his father’s illustrious legacy to ever greater heights. The Yebala Confederation shall endure the passing of its greatest leader, for such is the way of the land."
RIF.224.a:0 "May Allah guide the young warrior onward."

RIF.225.t:0 "The Tenacity of the Riffian"
RIF.225.d:0 "Sharif and Sultan Mulai Ahmed er Raisuni has always been a shifty figure in the eyes of the Spaniards, fighting alongside them one day, only to emerge on the other side of the battlefield the next day. However, while it is certainly true that the bandit master of the mountains was a warrior of opportunity, and his many battles with Spain still sting in the minds of the Africanist officers Raisuni offered the bitter taste of defeat in his wake, Raisuni has never considered himself to be an enemy of Spain in the traditional sense. Instead of fighting Spain for the sake of Spain, Raisuni has fought Spain’s ignorance, stubbornness and simplicity of its commanders and colonial administrators. The local governors and imperialist officials look at a road from Tétouan to Tangier and decide that they shall conquer it all in the name of Spain, and once this mission is complete, it becomes a part of their protectorate.\n\nHowever, Raisuni’s entire military strategy has, from the onset of his struggles against Madrid, been focused on the resilience of the Arabs. The Moors of Rif do not let the invaders destroy their spirits. When their house is burned down, they go to live in their neighbour’s house. If you burn his crops, he eats figs. If there are no figs, he lives on grass and what game he can shoot. If all his villages are burned, he goes away, saying, ‘It is the will of Allah’, and he sits down behind a rock and digs a little hole to sleep in. When that is discovered, he finds another and, always, he cleans his gun.\n\nIn Raisuni’s mind, the Spaniards can bleed themselves dry trying to conquer these lands, but as is evident by the return of not just Abd el Krim but also Mulai Ahmed er Raisuni, the Spanish can never truly control the vast open plains or the mighty mountains for the nature of the people who inhabit the Rif has been honed and refined by centuries to withstand such attempts, to repel them and to earn their freedom once more, even if said freedom can only be achieved deep in the bosom of the Atlas chain where no Spaniard dares to venture into. Only man capable of conquering the Rif is the Sultan himself, and with the Spanish defeated, it is only a matter of time until he can harness the spirit of resistance among his people for even greater aims."
RIF.225.a:0 "We truly are unconquerable."

RIF.226.t:0 "House of Tears"
RIF.226.d:0 "Before his defeat in the Rif war against the combined might of the Spanish army and his bitter rival Abd el Krim, Mulai Ahmed er Raisuni was one od the richest men in all of Morocco. His fiefdom reached from the snowcapped Atlas mountains to the glimmering water of the Mediterranean and the storm-lashed shores of the Atlantic, and his people feared the great Sharif but also, paradoxically in some cases, loved Raisuni for the security and prosperity he had brought. One of the Sharif’s most priced possessions was his palace, which was colloquially known as the House of Tears due to the forced labour that was used in its construction. When Raisuni first ordered it to be built, columns reaching to the very horizon with the local people, poor and rich alike, could be seen carrying sun-scorched bricks, ancient stones and other material to the Sultan of the Mountains. The Eagle of Zinat did not take these offerings without repayment, however, and in his own words, the bricks and stones of the locals were far more valuable to Raisuni than the grazing herds or the grain of the farmers would have been as tribute. Once finished, in a bit over a year’s worth of work, greatly expedited by the rather indentured nature of the workforce, the palace was a true marvel of Moorish engineering and architecture, sprawling into all directions while remaining out of sight from prowling agents of the Sultan’s enemies. Many visitors er Raisuni would grace with his presence marveled at the construction, both in its beauty but also on the fact that it was built in such a way that anyone approaching it could not see the palace before basically entering its yard. One of Raisuni’s favourite features of the structure was its forty-five metre long fall down into a canyon where Raisuni would regularly have thieves and other lawbreakers walk into as punishment, though some such punished did claim that the stones below were softer than the rage of the Sultan. Some claimed that the House of Tears name came from the cellars below the palace where Raisuni would have his prisoners tortured, but this was untrue for the entire site had no basement of any sort, and in any case the Sultan preferred to do his punishment of those needing of such out in daylight. Once Spanish soldiers drove the Sharif out of his home, the House of Tears was ransacked by the savage Spaniards, and upon his reconquest of the Rif region, er Raisuni has had to return to ruins. However, the bandit king has always lived by the maxim that great men do not need great buildings, and while numerous captured Spanish soldiers and prisoners from Abd el Krim’s are put to work on adding a few more tears into the eponymous house of such activity, the Sharif is perfectly content in waiting out the reconstruction period in a humbler abode."
RIF.226.a:0 "A proper nest for the great Riffian Eagle."

RIF.227.t:0 "Barbary States Born Anew"
RIF.227.d:0 "When Mulai Ahmed er Raisuni was at the height of his power, the people of Morocco trembled at his feet and even the great powers of the world had to consider their actions near the Gibraltar strait, for the mighty Sharif was not a menace merely on land, but his fleets could harass shipping like Barbary Corsairs of old. Nonetheless, as the many battles made the Sultan of the mountains weary, and the Spaniards brought the full might of their armada to the region to crush the commoner rabblerouser Abd el Krim, the ships and boats of Raisuni fell to the wayside, destroyed by Spanish vessels or hidden in caves, waiting for better times. However, following the collapse of Spain and chaos gripping the peninsula, much of the Spanish fleet is in disarray, its once mighty destroyers, cruisers and battleships left adrift in the colonial waters or in foreign ports as the Madrid government desperately clings to survival.\n\nParts of the Spanish navy fled here to the Rif region as well, but as the Spanish Legion and colonial administration was wiped out by the various rebel groups, so too the admirals and captains of the Armada Española suffered an equal fate. Their ships, at least those with crews too slow or stupid not to take to the seas when the citadels of Spain fell, have now been taken over by the eager sailors of the Sultan, and as the vessels of Spain are being pressed into new use as brigands of the sea, many more are joining the cause as well, drifting back into the sea from their hiding spots along the Atlantic and Mediterranean coastlines. The once mighty navy of the Sharif is gathering back into the ports of Tangier and Al Hoceima once more, ready to bring fear into the hearts of merchant ship captains seeking to cross the strait in their ships laden with treasures and trinkets from far away lands.\n\nIn the footsteps of the Barbary pirates, the sons of Rif once more take to the seas in large crafts, teaching the infidels that while they may have ruled the Mediterranean for centuries now, the time of the Muslim raiders has began once more, and in due time, they will all once more fear the green flag with its white skulls. This is bound to stir up trouble with the various imperialist powers of the world, but by carefully targeting only ships from nations with low presence in the Mediterranean, and avoiding those that belong to factions such as the Internationale, Ottomans and Egypt’s allies, the Rif pirates will haul home quite a few heavy bounties in no time. With the Americans asleep and Europeans looking to engage one another on the battlefield once more, the highwaymen of the sea in the Rif region shall benefit from the spoils of war."
RIF.227.a:0 "The sea is ours once more."

RIF.228.t:0 "Barbary States Born Anew"
RIF.228.d:0 "While it may often seem that the great Sharif Mulai Ahmed er Raisuni is little more than a bandit warlord in his own mountainous fiefdom, the Sultan has spent a great portion of his life learning the ins and outs of the European politics, and as the Arab world has began to wake up from its slumber under colonial powers and the Ottoman empire, Raisuni has seen fit to focus his attention to the Middle East as well. While the focus of Raisuni’s policies has always been largely contained to the Rif region and Morocco as a whole, he has nonetheless maintained a strong commitment to the Islamic faith and ideas of Pan-Islamism, seeking the unity of Muslims as a cornerstone in the faith’s survival in the modern world. Raisuni’s pragmatism towards the Spaniards made him an easy target for more fanatical Islamists in the past, who claimed him to be little more than a collaborator to the Christian imperialists, but Raisuni was simply biding his time and considered the benefits of alliances with the Spaniards to far outweigh the negatives.\n\nHowever, men like general Manuel Fernández Silvestre showed Raisuni that for all his benevolence towards the Spaniards, it only took one man’s hubris to topple the great plans Raisuni had laid out for Rif under the Spanish protection, and the Islamists who once saw Raisuni as a lackey of Madrid have had to eat their words in the aftermath of the Sultan’s rebellion and reconquest of the Rif region. Nonetheless, as Raisuni consolidates his realm, he must come to term with the fact that his Pan-Islamist ambitions are now directed towards a movement that is deeply divided. In the north, there is the Ottoman empire, bastion of tradition though not without its modernising voices in the shape of Mustafa Kemal Pasha and the liberals, and in the south there is the rising power of Egypt, guided by the ambitious but flawed monarch Farouk and his coalition of various political forces looking into the future or past for inspiration.\n\nWhile Farouk’s movement is certainly the more dynamic and reinvigorated direction of Islamism, it is also one deeply ingrained with ideas of Arab supremacy, and to the Berber tribesmen of the Rif this may be hard to swallow. However, the Ottoman empire is weak and sick, and through this weakness, it may find itself to be an unreliable ally to Raisuni’s growing empire, if it even considers an alliance with such an outlaw state worth pursuing. Raisuni must choose the direction of his people, and such a matter must not be pursued lightly"
RIF.228.a:0 "The cause of the Ottomans is our own."
RIF.228.b:0 "We shall rise as part of the Arab world."
RIF.228.c:0 "The sons of Rif shall forge their own path."

RIF.229.t:0 "Raisuni’s Benevolence"
RIF.229.d:0 "It is no secret that Mulai Ahmed er Raisuni is, despite his rather towering appearance, warrior status and legendary myth of a bandit king, a learned man. While much of his recent decades as a ruler of the Atlas mountains have gone by in battles and constant struggle for survival against the ever-present Spanish colonials as well as the hostile Moroccan troops, Raisuni has nonetheless fought hard to maintain his deep knowledge of the world, Islamic law and theology. However, while he is a traditional ruler in many ways and sees his absolute rule as beneficial to the people of Morocco and Rif, Raisuni is no fool, and realises that if his people are to become a part of the modern world, there must be ways in which the region can be brought to the level of civilisation and understanding that Europe and the Americas have.\n\nTo Raisuni, the shortsightedness of the Arab is his greatest weakness, and while Rif is a land where nothing seems to change, even as great empires holding it in their grip rise and fall, the rest of the world is not quite as static and slow to develop. As such, scholars, chief among them Raisuni’s cousin Mulai Sadiq, who has spent much of his life learning all he can from various ancient Islamic and Moroccan tomes, have been summoned to the House of Tears, Raisuni’s grand palace, to organise the educational framework of Raisuni’s new Riffian realm. While men such as Mulai Sadiq and other learned men will be in charge of organising the educational institutions needed to transmit knowledge of Moroccan traditions, religious customs and laws to the people of the region, Raisuni has showed his legendary clemency in other ways as well.\n\nEducated men and teachers who belonged to the Spanish colonial administration have been recruited by the Sharif’s agents to act as teachers in new Riffian schools, aimed at showing the wonders and marvels of European science and enlightenment to the local people, one village at a time. Nonetheless, as stated before, Raisuni is no fool, and each teacher of this nature will be deeply vetted so that they do not install dangerous thoughts of Hispanism or European liberal democracy into the minds of the Riffians, who are not capable of grasping such concepts without drifting into radical fanaticism as Abd el Krim did. Rif shall reach the European level of development, but do so in a manner that suits the local way of life."
RIF.229.b:0 "Our own way to scientific peaks."

RIF.230.t:0 "Moroccan Nationalism in the Image of Raisuni"
RIF.230.d:0 "The reign of Mulai Ahmed er Raisuni has not been an easy one, and throughout his exile in the Atlas mountains, his determination to shape the Rif and rest of Morocco in his image has only grown stronger. Nonetheless, as he now sits upon the ruins of the Spanish protectorate, a force in the region the Sharif once allowed into his realm out of naive trust in the promises of the Spaniards, the Sultan has come at a new crossroad. The regime he has built from the ground up is a formidable machine, but as the new kingdom is in the process of being moulded into a force to be reckoned with, it lacks direction. Raisuni has always been a benevolent and good ruler, but few would argue that he has not done so through illicit means. As such, members of his council of ministers tend to argue among themselves on which direction the great Sultan should guide his new nation. Members of the Yebala tribe are of the opinion that Raisuni should retain supremacy of tribal confederalism as the guiding principle of his reign, letting Rif stand as it is, though some have argued that even further decentralisation is needed and that the Sharif should grant most of the power to local chiefs in order to let the region be the wilderness it has always been.\n\nAfter all, if the Spaniards, French, Germans and Moroccans have been unable to tame the Rif, who is Raisuni to try it either. His generals on the other hand, especially those with long history with banditry, such as Ali Ueld el Mudden, have noted that the Sultan should allow them to transform the realm into a true den of highwaymen, seeping their tendrils into nearby states and terrorising the entire Maghreb for the profit of the local tribes. However, his admirals are of the opinion that there is far greater bounty out in the seas, and thus the Sultan would do well to emulate the Barbary pirates in his new state, turning Rif into a force of nature with its strong fleets and strategic position on the shores of the Mediterranean and Atlantic.\n\nFinally, Raisuni could of course simply ignore his aides and commit to either ruling as a true warlord, playing into the lawlessness of the Rif while maintaining his own status as its unquestionable ruler, or alternatively, posit himself as the only legitimate monarch capable of guiding his people towards a brighter future, somewhat in the image of European absolute monarchs. Finally, Raisuni could also utilise his ancestral ties to Sufism to empower mystics of the faith and paint himself as a mythical figure, the grand saviour of the Rif and Morocco as a whole, creating a mix of absolute monarchism and Sufism to reign as a truly unique Sharif of the realm."
RIF.230.a:0 "Tribal tradition must remain."
RIF.230.b:0 "We were bandits for much of the last decade, we shall be bandits again."
RIF.230.c:0 "The terror of the Barbary pirates is our guiding principle."
RIF.230.e:0 "Raisuni shall simply act as one chief among many in the wildlands of the Rif."
RIF.230.f:0 "Raisuni rises to be the supreme warlord of the Rif."
RIF.230.e:0 "The word of the Sultan shall be paramount to law."
RIF.230.g:0 "Empower the Sufi saints as guides to the Raisuni dynasty."

RIF.231.t:0 "A Ride to Ruin"
RIF.231.d:0 "The Moroccan sultans have long been the greatest rivals of Mulai Ahmed er Raisuni, with his rivalry culminating during the reign of Abd al-Aziz bin Hassan, who was the monarch of Morocco during the legendary Perdicaris affair that made Raisuni a force to be reckoned with in not just domestic politics of Morocco, but on the international scene as well. However, while the Sharif has long held ambitions towards ruling all of Morocco, and has fought far harder to keep the land free from Spanish and French interlopers than the opulent and lazy Sultans in Rabat and now Casablanca, his realm has long been constrained to merely the Atlas mountains. Raisuni has ruled the mountains as the absolute authority in the region, and even during his exile from the Rif the Sharif could not be dislodged by any force on Earth despite numerous attempts by the young Sultan of Morocco or the Spanish protectorate authorities.\n\nHowever, now that Mulai Ahmed er Raisuni has taken over the Rif region as his own personal fiefdom, the rivalry between the bandit king and his rivals in Casablanca has reached critical velocity, and a confrontation is inevitable. The Sharif has rallied his troops and prepared to march across the mountains once more to finally end his grand nemesis in the Moroccan capital, and as banners from all tribes of the Jebala Confederation gather in Azeila, the people of Rif prepare for the final battle ahead. The fate of Morocco will be determined at last, the Kingdom of Mohammed V shall face the Sultanate of Raisuni on the mountain passes and open fields of the region until only one force remains.\n\nThe agents of the Sultan of the Mountains have been hard as work as well, and thanks to their efforts, Raisuni is now convinced that despite the protectorate status of Morocco, the Germans will not come to the aid of the Casablanca regime because they consider the rebellion in the Rif to be a dangerous quagmire that the Kaiserreich simply cannot involve itself in. The drums of war now beat throughout the Rif, and as the old brigand monarch climbs on the saddle of his sturdy warhorse and brandishes his sabre in the scorching sun of the Rif, his enemies in Morocco proper shudder in fear. The final confrontation is at last here, and a rivalry spanning three decades shall come to an end."
RIF.231.a:0 "Arise, arise, riders of Rif!"

RIF.232.t:0 "Cruelty of Copper"
RIF.232.d:0 "Stories and tales of the cruelty of Mulai Ahmed er Raisuni are as numerous as the grains of sand in the Riffian deserts, but hardly many are true. While Raisuni certainly has plenty of ire for his enemies, and does not spare violence on those who break the ancient laws the Sultan so rigorously follows and enforces, many claims of his cruelty omit the fact that the Sultan never punishes without a good reason. Perhaps the most famous of his tactics in making the wrongdoers see the errors of their ways is to heat up copper coins to the point of burning skin, upon which they are then placed on top of the eyes of those convicted of crimes. However, while such a performance could easily destroy the eyesight of these men, Raisuni preferred to use the coins in a manner where they would burn their eyelashes but not harm them any other way, and as the men had their eyes closed, Raisuni would claim that he would give them their eyesight back even despite the ‘grievous damage done to the eyes’ if they repented and swore off from following such a disastrous path.\n\nMany did so, and the coins were lifted without any actual damage being done, though if the person was caught in the act once more, they weren’t as lucky. However, while certainly fierce to his opponents, Raisuni is a deeply religious man, and believes that while fear is a capable weapon, punishment of the innocent goes against the will of Allah. As such, he has eschewed the use of brutal control in favour of surgical use of violence against actual criminals of a wrong nature, and as such, the Sultan has even gone as far as to abolish the prison system set up by Spain.\n\nIn his view, it is useless, as the Sharif only needs to state to the lawbreaker that he is Raisuni’s captive, and most men in the Rif will believe this to be true, for there is no part of the region where the Sultan’s eye does not follow them. Raisuni demands absolute loyalty from his followers, and in exchange for said loyalty, their prospects are massively increased, but those that go against the rule of law must suffer the consequences, for that is the only way the Riffians will know order."
RIF.232.a:0 "There is no rock under the sun where one can flee from er Raisuni."

RIF.233.t:0 "Reestablishment of the Makhzen"
RIF.233.d:0 "The Makhzen was an institution set up by the Spanish to act as a council of local figures from the Protectorate of Northern Morocco, chiefly local caids, Pashas and the vaguely appointed monarch-governor, the Jalifa. It ruled in the city of Tétouan, and while much of the power in matters of economy, statecraft and executive power was piled into the hands of the Spanish colonial administrators, military personnel and the representatives of the Tangier International Zone, the Makhzen still possessed the legislative power in the protectorate, which gave it a margin of influence within the borders of the Rif. Ever since the collapse of the protectorate, the influence of the Jalifa has become a relic of the past, and the Spanish collaborator has wisely fled the country as quickly as he could.\n\nNonetheless, various officials and caids of the Makhzen have remained in Tétouan, with perhaps the most prominent remaining figure being the famed Grey Eminence and strongest advisor of the Jalifa, one Ahmed Belbachir Haskouri. Belbachir was possibly the most important man in the Jalifa’s court, running his household as well as acting as Moulay Mehdi’s eyes, ears and mouth in the Riffian affairs. While there is a degree of mistrust between the new Raisuni government and the Makhzen, Raisuni has never been particularly hostile to the Makhzen as an institution, and most of his grievances with the institution have been aimed at the fact that it was trying to bring a rather Western concept of a pseudo-parliamentary institution into the Riffian way of life, and the Jalifas themselves were little more than foolish puppets of the Spaniards.\n\nHowever, it is clear that something similar to the Makhzen could be of great use in legitimising the rule of the Sultan, all the while delegating part of the governance and lawmaker to the caid experts. However, to ensure that the confederation-esque nature of the current Rif regime remains, Raisuni has sought to bring in caids from everywhere in Northern Morocco, from all tribes loyal to him, to be a part of the Makhzen, accounting of course on the seniority and experience of the caids. This way, when the old Sharif finally meets his end, the nation has had some of its governance delegated to civilians and the burden of leadership does not rest solely in the hands of various allies of Raisuni, burdening them unnecessarily."
RIF.233.a:0 "Modernity at a slow rate." 

RIF.234.t:0 "The Prince of Tobacco"
RIF.234.d:0 "Juan March Ordinas, the richest man in Spain, has a long and complicated history with the region of Morocco, funding much of the Spanish war effort during the Rif war while also trafficking weapons to the rebels of Abd el Krim. His great fortunes were made during the Weltkrieg, when March, a Mallorcan with a keen eye on business and smuggling, made a name for himself as the key tobacco smuggler in the Mediterranean, earning him enough capital to establish himself as a figure in the banking sector. However, while March may have tried to cultivate an image of going ‘legitimate’ in his ventures, the various schemes and predatory acquisitions of March suggest otherwise. While March temporarily lost his tobacco monopoly in Northern Morocco following the proclamation of the Second Spanish Republic, his position as the economic hegemon in this lucrative business was restored following the Sanjurjada coup, and now his company, Compañía Trasmediterránea, SA, is involved in all sorts of other shipping activities in Northern Africa through Rif.\n\nInitially, March pulled out most of his assets from the region following the Spanish collapse, but given his prominence in the Rif, and the rather illicit nature of Mulai Ahmed er Raisuni’s previous activities while in exile has made their partnership a logical next step in not just getting more investment into the region for Raisuni, but also letting March back into his old turf. While the monopoly March now possesses is hardly the golden deal he got under the Spanish colonial administration, it is still a massive boon for the banker, especially as much of his previous financial heft disappeared into ashes in the fires of the Catalan war for independence.\n\nRaisuni obviously does not trust the cunning old fox in the slightest, but he always argued that Spaniards make for great friends because one always knows they are lying, and thus there is no need for second guessing their intentions. Nonetheless, even if the pirate capitalist of the Mediterranean has been allowed back into his cash cow, Raisuni’s agents will keep him on a short leash, and if the usual intrigue surrounding the man shows signs of Spanish infiltration, every last ounce of gold March has milked out of the Rif will be recovered by the Riffian bandits via violent and direct means, even if means razing Banca March in Mallorca down to the ground."
RIF.234.a:0 "Always pleasure doing business with the dishonest sort." 

RIF.235.t:0 "Jinns of the Night"
RIF.235.d:0 "Few men better characterise the Mehalla of Mulai Ahmed er Raisuni than his famed general Ali Ueld el Mudden. A childhood friend of the Sultan, el Mudden has often been compared to the jinns of Moroccan folklore, for he is a trickster without peer. With just fifty men at the beginning of Raisuni’s war against Spain, el Mudden struck fear into the hearts of Spaniards throughout the Rif, capturing prisoners through surprise attacks, hiding in the woods mere centimetres from marching Spanish columns and looting enemy farms and bases when their guards had been directed towards ambushes and false sites of el Mudden’s activity by local civilians, with or without their knowledge of the truth. Using caves, mountain passes and other hiding spots, el Mudden would conceal his troops from the Spanish and strike at their rear at every opportunity. He had dozens of disguises, ranging from European clothes to fine Riffian garments, Spanish officer uniforms and even peasant rags with just the enough wear on them to appear legitimate, and despite his qualities as a skirmisher, ambusher and guerilla, what el Mudden excelled was being a spy.\n\nRaisuni himself often remarked that it was easier to keep the stallion from the mare than news from that man, and as with his guerilla tactics, el Mudden used his talents in infiltration to gather intelligence far behind enemy lines, stealing a new disguise when the situation demanded it and praising the person ‘loaning’ him the outfit for their service to the warrior, though often enough such praise fell to deaf ears given the dead state of the ‘donor’. Throughout the war to reclaim Rif and return the Sultan from his exile, el Mudden was a constant pain to the Spaniards, appearing behind their lines to wreak havoc, only to disappear back into the mountains where every cave was his home, and when the High Commissioner of the Protectorate tried to hunt him down, the Legionaries and Regulares of Spain could have been hunting jinns with as successful results.\n\nThanks to his efforts, the Spanish forces had been completely neutered even beyond the circumstances unfolding on the mainland, and when the time for killing blow came, el Mudden’s troops did their last commando raid on the Spanish headquarters. Now, the old mountain rogue has returned to train the Mehallas of his liege, and thanks to his efforts, the Riffian tribal warriors have never been as cunning, courageous and sneaky. Whatever force the Sharif needs destroyed in the future, the enemy will be in for a surprise of their lives when the guerillas of el Mudden materialise behind their lines from seemingly thin air."
RIF.235.a:0 "Our foes shall tremble at the mere mention of el Mudden."
 
RIF.236.t:0 "Resurrection of the Corsairs"
RIF.236.d:0 "With Morocco secured and the dark night of both Spanish and German dominance over this little corner of the Maghreb lifted, the Sultan of the Mountains has achieved the greatest peak in his power. Despite the twists and turns of the Sharif’s life giving him an existence filled with hardship, difficult decisions and constant struggle for survival, Mulai Ahmed er Raisuni has done more than endure them, he has shaped Rif into a region where men such as himself can thrive. However, while the new Sultanate of Morocco is a glorious sight and much celebrated across the Arab world as yet another triumph against the European colonialist menace, the taste of success has admittedly inebriated the old monarch. Raisuni, long rumoured to be the last of the Barbary pirates, has carried the title with pride, but perhaps it is no longer too ambitious to think that this situation could be reversed.\n\nArmed with new weapons plundered from Moroccan arsenals and financially steadier than ever before thanks to the treasures of the Casablanca regime, Raisuni now has the money and weaponry to pursue an end to the Algiers regime. The French National State, while weakened by the loss of her mainland empire, has always hung over the triumphs of the bandit king like a sword of Damocles, and now, the remnants of the French colonial might stand as the last bastion against his ambitions to recreate the Barbary states of old. While the new state of Raisuni certainly possesses the might to wrestle with the French regime, the Sultan is not long for this world at the present, and thus it remains a risky gambit to pursue in a realm that may very well collapse once its most famous helmsman leaves this world. As such, the Sharif must weigh his options, whether to chase the dream of bringing about a new era of the Barbary corsairs, or to shelter his people from further wars."
RIF.236.a:0 "The French grip has lingered on the Maghreb long enough, we honour our ancestors and adopt the flag of Barbary." 
RIF.236.b:0 "More wars will only diminish what we have built here." 

RIF.258.t:0 "The Spectacle of Warfare"
RIF.258.d:0 "Charles Sweeny has seen combat since the early 20th century, but it was not until the beginning of the Weltkrieg that the veteran mercenary began to truly understand the concept of war. From his first experiences of total war, diving into shell craters gripped with fear during his first meeting with enemy artillery ,to the shame he felt for such perceived cowardice after the German bombardment cleared, all the way to the day when he lay nearly dead in a ditch after attempting to repel a German counterattack, Sweeny underwent a rather long and complex transformation through the lottery of battlefield Darwinism. In the fires of the Weltkrieg, only the lucky or competent survived. The man who had gone into Latin American nations in search of an adventure and a life of a soldier for hire returned to the Americas from the European bloodbath with a clear vision that war was no adventure or playground for would-be heroes and gloryhounds.\n\nWar, at its essence, was hard, grueling labour, but it was not just that. Sweeny has long since described his view on war as something of an addiction, as men overcome the initial shock of combat, they become dependent on the fear and thrill of war, searching far and wide to get the ability to participate in the bloodletting once more. It is not necessarily a matter of killing, but instead of being shot at, being on the very cusp of events that may lead to victory or death for the warrior. While certainly an attitude that frightens those not necessarily on the same wavelength as Sweeny himself is, it has become a key part of his new mercenary dogma. Each and every fighter in his army shall come to the terms that the mercenary state of the Rif has no place for men seeking to immortalise themselves as the next Herakles or Roland, but instead the Riffian realm is a place for fighters who no longer have a place anywhere else in the world, for those who need the euphoria and terror of combat to sustain themselves.\n\nWar may be hard labour in the view of Sweeny, but it is a toil that leads to thrill unlike any other. Thanks to the business-savvy nature of Charles F. Sweeny, the commandant’s nephew, and the new near mythical status of the old mercenary who conquered a nation for himself, the men under Sweeny now have enough contracts to satisfy their need for a right old ruckus for quite some time. With the civilian and administrative apparatus of Tétouan and Tangier built up to sustain their military arm, the privateers of the region have everything prepared for the final showdown brewing in Europe."
RIF.258.a:0 "And we shall capitalise on it in time."

RIF.259.t:0 "Time of Payback"
RIF.259.d:0 "With Charles Sweeny’s new takeover of the Rif region complete, the mercs have set to work chasing out all the enemies of the new regime. The tribal fanatics of Abd el Krim have been deeply crippled by their loss of leadership, and in a matter of days, rest of the military machine of the desert fox has been wiped out. The various bandits, remnants of the Spanish Legion and other militant groups in the region were quickly sent into hiding or early graves as the columns of Sweeny’s mercenaries marched into the largest settlements in Tétouan and Tangier, dispatching all enemies on their way. The Moroccan auxiliaries and shock troopers that had previously served Spain chose to sit on the sidelines, uninterested at resisting the new rulers of the Rif, and the political forces of Tétouan quickly capitulated to Sweeny’s demands.\n\nHowever, while the mercenary leader now has few capable enemies left in the region to worry about, the future of his new regime hangs at a balance because of external factors. While originally hired by Spanish agents to fight on behalf of the local colonial government, Sweeny’s ties to France made this venture possible in the first place, and the Algiers government is rather excited to either attach the Rif into its burgeoning administration to gain access to the profitable mines of the region, or to empower the local International Zone administration as a more legitimate form of a takeover. The Algiers government is not particularly fond of Sweeny’s ambitions to rule the state as a mercenary realm, though with sufficient concessions, the French National State could be swayed to look the other way.\n\nAfter all, the main reason they sponsored Sweeny’s mission was to get rid of Abd el Krim, something the soldier of fortune has done very handily. Nonetheless, if Sweeny is unsure about his prospects at the helm of the new territory, he can offer to fulfill the French demands, either empowering the Tangier International Zone as an neutral territory in the region or allow Rif to be annexed into the wider French colonial empire."
RIF.259.a:0 "Following large concessions to French corporations, the Rif stays independent." 
RIF.259.b:0 "Uninterested at governing the new state alone, Sweeny hands power to Tangier." 
RIF.259.c:0 "Yielding to French pressure, Rif is annexed into the French empire." 

RIF.260.t:0 "Destroying the Emir’s Legacy"
RIF.260.d:0 "Rooting out Abd el Krim and his band of rebels is a hard task for any man or organisation, the bloody years of the Rif war taught not just the Spanish colonial administration that, but also the French forces and Charles Sweeny as well. However, what makes the current situation different from the trials of the past is the fact that Abd el Krim has had far less time to strengthen his control over the Rif, and while many tribes heeded his call, others, bittered by the experiences of the Rif war, completely turned away from the self-proclaimed Emir of the Rif. After Sweeny’s troops defeated the government of the Rif in the confusing and brutal battle of Ajdir, el Krim and much of his government was killed in the fighting, and the few remaining survivors have been handed over to French authorities.\n\nHowever, far harder is to root out the myth of Abd el Krim, who has spent years building up a legend of himself as a figure similar to the Kemal Pasha of the Ottoman empire, a man hell-bent on dragging Rif into the modernity. However, Sweeny has personal experience with the Turkish reformer, having made fast friends with the Grand Vizier during his numerous travels, and Sweeny has used this personal knowledge to posit himself as the actual Kemalist figure, attacking each and every part of Abd el Krim’s policies and scrutinising them in the propaganda of his new mercenary state, painting the Riffian warrior as little more than a despot who wished to drag the entire region back into the dark ages with his fanaticism and zealotry.\n\nWhile the Riffian tribesmen care little for what the outsider conqueror claims, they have been relatively surprised by Sweeny’s knowledge of the Islamic world and the connections he has with the Turkish intelligentsia, and have taken his arguments with glee in some cases to discredit the dominance of the tribes led by Abd el Krim. The arguments of Sweeny have mattered little in actual fact, but they have given the various chiefs in the Rif the ammunition needed to uproot the false moderniser el Krim and his ilk from any important positions. The destruction of el Krim’s legacy will take decades, most likely, but through Sweeny’s application of actual Kemalist policies, it is possible that at least one part of el Krim’s personality cult will start to ring increasingly hollow in the minds of the native Riffian population."
RIF.260.a:0 "One person at a time, the memory of el Krim will be rooted out." 

RIF.261.t:0 "The Sleeping Giant’s Hubris"
RIF.261.d:0 "When the Weltkrieg finally began in 1914, Charles Sweeny was among the first volunteers from the United States to enlist in the ranks of the French army, and for much of his time in the French military during the war, he was at the very forefront of the trenches, even being the first American volunteer to earn the Croix de Guerre for his numerous heroics during the war. However, while Sweeny was certainly a talented soldier and rapidly rose through the ranks from corporal all the way to a captain during the war, he was also recklessly brave and found himself wounded on numerous occasions, harshest of which happened in 1915. During a particularly vicious counter-attack following gains made by Sweeny’s shocktroopers, Sweeny’s troops found themselves surrounded and under heavy artillery and machine gun fire. Penetrated by a bullet in his lungs, Sweeny had been fighting till his recovery by other legionnaires, draped in the American flag he had on him to stop the bleeding, and it was then that the first era of Sweeny’s war came to an end. Hospitalised existence was completely alien to the wandering soldier, and while he raged to the staff that he should return to the front, Sweeny was directed to put his energies into gaining America’s entry to the war on the side of the Entente Cordiale.\n\nHowever, while Sweeny was certainly one of the most famous volunteers, especially as he had no illusions of glorifying the rigours of the war, the American politicians were hardly interested in supporting Franco-British efforts at curtailing the Hun menace. Sweeny was released from the hospital eventually, but much of his healing was still a process, especially as bits of the American flag he had used as an emergency bandage had been left in the wound and caused it to heal much slower than anticipated. Nonetheless, Sweeny accompanied general Joffre on a visit to his home country, and together with other American volunteers, Sweeny tried his hardest to convince the American people and political establishment to join the war, but to no avail. Embittered by the experience, and the collapse of the French state in 1919, Sweeny swore to never again support America’s perverse isolationism, driven more by mindless navel-gazing and ignorance to world affairs as well as cowardice on behalf of the politicians than any coherent adherence to the needs of the American people.\n\nAs if due to some divine justice, United States is now wracked by political and economic turmoil of catastrophic scale, and its place as the rising superpower has been thoroughly dwarfed by the German behemoth it allowed to rise in its place. At least in Morocco, and perhaps later on, in other parts of the world, Sweeny and his band of rogues can help reverse this grave historical injustice, and perhaps, in time, the American people grow the spine needed to pursue a better global order as well."
RIF.261.a:0 "Never again shall our homeland fall because of inaction." 

RIF.262.t:0 "The Generosity of the Guns for Hire"
RIF.262.d:0 "Charles Sweeny has never hid his sympathies for the French colonials, and part of his reason to join the Rif squadron and the wider Rif conflict came from his understanding that the French colonial mission was necessary to bring the local populace to closer level with Western enlightenment. Sweeny may have been heavy-handed in his pursuit of the Riffian leader Abd el Krim, partially because of his belief that el Krim had a hand in the disappearance of Sweeny’s heartthrob Capitano Juanita and partially because the mercenary considered el Krim a German agent and a dangerous advocate for the worst excesses of Islamic conservatism. Nonetheless, while certainly against Islam’s influence in the region, Sweeny had much to say about the local population, and compared especially to his remarks of Abd el Krim, much of it was praise.\n\nHe often quoted the Riffian marching song in letters to friends and colleagues, a song which lyrics went most often ‘One Englishman is a sportsman. Two Englishmen are a drunken brawl. Three Englishmen is a Colony. One Spaniard is Don Quixote. Two Spaniards are Don Quixote and Sancho Panza. Three Spaniards are a disaster. One Riffian is a sniper. Two Riffians are a Battalion. Three Riffians are a victory.’, claiming that the sentiments of it were true. Ever since the Rif Squadron’s takeover of the region, Sweeny has been hard at work recruiting former Regulares into his ranks and even extending the invitation to former fighters of Abd el Krim, claiming that the mercenary state he seeks to create will honour the promises el Krim made and go beyond them, respecting the faith of the locals but keeping it out of politics, providing funds to suffering farmers and tribesmen who have been met with the harsh reality of the famine and upgrading local institutions to be up to the standards of Western nations, without destroying local nature and culture.\n\nThe Riffian mercenaries shall be paid the same amount as the men under Sweeny’s original command, though this will be in an imbalance early on as many of the mercs are officers in rank, but Sweeny is already setting up programs to uplift local Riffian troops into non-commanding officer and commanding officer roles. Finally, military leaders who led the various troops under Spanish command will be given their ranks and roles back, with equal pay to the Western mercs, including high-ranking officers such as Mohamed Meziane, as long as their loyalty can be acquired with cold, hard cash."
RIF.262.a:0 "There’s enough gold and steel in the Rif to not be stingy." 

RIF.263.t:0 "Toppling Tyrants World-Wide"
RIF.263.d:0 "The global view of mercenaries is hardly a particularly positive one. Where there is war, especially low-intensity, small-scale fighting between poorer states or political factions, there will be war dogs from all around the world ready to earn their pay by putting more holes in the enemy side than they themselves sustain. Given the nature of the career, few soldiers of fortune are in it to pursue lofty ideals or civic virtues, with perhaps the only strong political opinion among most being a general aversion to syndicalist or collectivist ideals. However, while rare, there are those who see the life of a gun for hire to be a part of something greater than simple acquisition of wealth. Charles Sweeny, commander of the Rif squadron, has always been such a man at heart. Sweeny’s military career began at West Point, where he was forced by his father to get some sense and discipline into a rebellious and deeply independent young man, but Sweeny soon proved impossible to control and his studies ended when Sweeny chose to prank the station commandant by shooting a cannon into the man’s roof, resulting in Sweeny’s arrest and expulsion from the academy.\n\nThe future mercenary soon left the United States, first fighting alongside Mexican rebels as he felt deeply for the suppressed workers’ movement there and sought to topple president Porfirio Díaz, though he soon soured on the rebelling faction of Francisco Madero and left for Venezuela, seeking to topple the rule of another dictator, this time president Cipriano Castro. That particular intervention did not go well, as Sweeny found himself in a desperate struggle for survival, his horse shot out under him and the troops around him cut to pieces by the government forces. Sweeny survived, but had to plea to the president directly by claiming that he was merely a journalist, and thanks to the ever-present American hegemony, the Venezuelans let the soldier of fortune go as to avoid a diplomatic incident. He fought the final war in Nicaragua, helping American troops overthrow president José Santos Zelaya before promptly leaving the nation out of fear that he would be killed by the new government seeking to avoid paying the mercs back their fee.\n\nThroughout rest of his life, Sweeny has chosen his gigs primarily based on his personal morals and sense of duty, seeking to fight not just for money, but to shelter those in need of sheltering and to defend the freedom of others, even if it meant putting himself in harm's way. Sweeny seeks a cause, a way of honour, not a fight that earns him the best possible pay, but it would appear that in his pursuit to root out the tyrant Abd el Krim, the old war hound may have bit more than he can chew, for this particular job landed him not just a fee, but a post as a governor of the Rif. Nonetheless, accordingly for his morals and convictions, Sweeny has taken this challenge on as well, enlisting himself as the benevolent ruler of the Rif until the region is ready to return to normalcy."
RIF.263.a:0 "Rif shall soon become a true nation, free of despots and exploiters." 

RIF.264.t:0 "Metal Boxes of the Mercenary Order"
RIF.264.d:0 "Mercenaries are often capable fighters, and their grasp of infantry tactics, guerilla strategies and newest fads in military science are well-known, but while there are plenty of commandos and assassins in the ranks of the guns for hire, few mercenaries are sufficiently well-versed in the future of warfare, the tanks or Panzers of today. As is so often the case, however, Charles Sweeny, commandant of the Rif region and leader of the Rif squadron, is an exception to this reality, having earned plenty of experience with these metal boxes during the Weltkrieg while he was still recovering from wounds suffered in 1915. Already in those early days of armoured warfare, commanding primitive, slow and bulky deathtraps such as the Schneider CA1s and Char Saint-Chamonds, to eventually end up with the first truly modern tank, the Renault FT, Sweeny was hard at work devising strategies and theories on how these new weapons of mobile warfare could be utilised. Sweeny supported the adoption of camouflage to the large vehicles, seeing it as a beneficial way to break their silhouette and better conceal them from artillery or even aerial enemies, though his most controversial reform was in the form of expanding his unit.\n\nThe armoured unit Sweeny commanded had sixteen vehicles in total, but in order to increase their effectiveness in utilising breakthroughs and to better support one another, the Legionnaire requested his commanding officer that the number of vehicles would be raised to fifty in total, including crews for the tanks. Bemused by the suggestion, his commanding officer had asked the soldier if he was looking to build a private army for himself, and in a bizarre twist of fate, Sweeny now commands a private army of mercenaries, pilots and tank crews. While the Rif armoured core is certainly not the most pretty or impressive thing to look at, comprising chiefly of those same Weltkrieg vintage tanks, primarily Renault FTs and Char CA1s, and reinforced by the odd more modern vehicle from the arsenals of National France, Kingdom of Canada and the few tanks captured from Spain, chiefly Trubia variants of the Renault FT, the tank corps is nonetheless a formidable weapon in Northern Africa.\n\nSweeny has spent the years since Weltkrieg honing his theory on armoured warfare, and seeks to use his new vehicles, limited as they may be, in large columns of sheer steel and weaponry to cause rapid breakthroughs, supported by mechanised or motorised infantry and the Rif squadron’s outdated but nonetheless lethal air arm. It will take some time until these weapons will be properly trained to reach the level of precision Sweeny demands, but when they do, the enemies of the Rif mercenaries shall quake in their boots."
RIF.264.a:0 "We do need to get some proper ventilation into these things soon." 

RIF.265.t:0 "Clashing Talons of Two Eagles"
RIF.265.d:0 "Ever since the end of the Weltkrieg, Charles Sweeny has had to come to term with the fact that the world he now inhabits is one dominated by the German Kaiserreich. The bitter enemy Sweeny fought so hard to contain during the war to end all wars had triumphed, and the world that now existed was wholly dominated by the Teutons. Left with few options, Sweeny escaped the crumbling French state, travelling Europe in search of a cause and covering the shaping of a new continental system on the ground for American newspapers, especially in the Ottoman empire and in various other parts of the globe. However, despite the two decades that have passed since the infamous end of the Weltkrieg, Sweeny has not let go of his grudge, hoping that one day, troops led by him could march deep into the lands of the German barbarians and make them swallow the bitter pill of defeat like he was forced to endure.\n\nNonetheless, these dreams have remained in the background until now, but as the victory of the Rif squadron has been finalised, Sweeny has returned to one of the tasks he is best at, recruiting capable warriors for a new cause. The venerable mercenary fighter is not nearly as rabidly anti-syndicalist as many other mercenaries, but given his loyalty to National France, Sweeny has gone ahead and formed the so-called Eagle Squadron, created with support from his nephew Charles Francis Sweeny and another American volunteer to France, Henry J. Reilly, drawing in Americans who have escaped the instability in the New World to the ranks of the Riffian mercs or have planned to do so in the future.\n\nThese Eagles are not simply limited to pilots, though those are the main category Sweeny seeks to find as the French government has promised to give them relatively modern fighters in exchange for their services, but Sweeny also seeks to recruit experienced special operations soldiers, guerillas and expert commandos to act as his special forces branch, parachuted into the Commune of France to wreak havoc. However, while publicly the aim of the Eagles is to fight the Communards, Sweeny’s interest in these battles are minimal at best, seeking to save the troops to the best of his abilities so they can be used against the real enemy, the German Kaiserreich. Whether this plan of his comes to fruition or not, the Eagles will nonetheless be a rather impressive new tool in the arsenal of Sweeny’s mercenary state."
RIF.265.a:0 "One day, we shall gaze at Reichstag in ruins." 

RIF.266.t:0 "Between Despots and Democrats"
RIF.266.d:0 "Throughout his career, Charles Sweeny has been guided into battles he considers to be worthy of his investment and blood, often fighting directly with the public establishment to pursue his goals. While his support for the French Republic during the Weltkrieg was seen as a noble path, and his many interventions in Latin America were guided at least partially by the desire to see tyrants toppled, Sweeny’s various excursions into the Rif region, his somewhat ambivalent stance towards the treatment of Armenians by the Turkish conquerors and his rumoured participation in the Russian civil war have been far more controversial affairs. Nonetheless, those close to Sweeny claim that while he generally is a staunch defender of freedom and abhors the newly emergent strains of totalitarianism in Europe, he has the tendency to become blind to the faults in the numerous great statesmen he has encountered throughout the years, perhaps most strikingly in the case of the Turkish military leader and reformer Mustafa Kemal Pasha and the French dictator Philippe Pétain.\n\nIt is clear that while Sweeny may speak about lofty ideals and defend various democratic republics with his life while toppling despots and warlords in other states, he is at heart still a man that expects others to obey his commands and follow his lead, and given his quick temper, those that seek to contradict them are made to suffer the ire of a war-worn veteran firsthand. As such, as the mercenary leader has begun to shape the Riffian state to his ideals, the very regime Sweeny has built is hardly particularly different from the Latin American presidential dictatorships he once sought to topple, with Sweeny as the all-powerful executive running the show and supported occasionally by his hand-picked advisors. More and more, the new commander of the Rif, very much a stranger in a strange land, has come to question whether he is becoming just another exploiter of these lands, no different from the Spanish brutes or the heathen Abd el Krim.\n\nFew men under his command are interested in representing the people, but to Sweeny, who claims to have always been a soldier of conscience, this schism between his ideals and the state he builds could very well lead to ruin on a very personal level. As such, the old warrior must choose on whether he seeks to follow his one-time idols and become a reluctant dictator for the benefit of the Rif, or to go against his nature and concede power to local parties, sharing in their governance and earning the moniker he was once given by American press as the ‘Red Colonel’ for his participation in various workers’ struggles in the Americas."
RIF.266.a:0 "The local people must have their first taste of democracy under our guidance." 
RIF.266.b:0 "The Riffians are not yet ready for such a burden of liberty." 

RIF.267.t:0 "Lawyers, Guns and Money"
RIF.267.d:0 "The new mercenary state of the Rif would in normal circumstances be considered a true international oddity and no doubt, its existence would be shunned by most nations of the world. However, thanks to the mercenary leader Charles Sweeny’s nephew, Charles Francis Sweeny, the Rif mercenaries have received ample support from the Entente. While the National France government is obviously endeared to Charles Sweeny, who fought for the nation during the Weltkrieg, the Canadians and British exiles have hardly had much interest in the venture. Or did not, until Sweeny’s nephew entered the scene. Charles Francis Sweeny may have very possibly never had much of a part to play in the foreign ventures of his uncle if not for his keen interest in the British exile politics and ability to easily move in the circles of Canadian and American societal elite. Wealthy thanks to the immense riches Charles Sweeny Senior, the father the Riffian mercenary and his brother Robert, Charles Francis’ father in turn, made during the Idaho mining boom, Charles F. Sweeny was destined for a life of success, further reinforced by his education in the top universities of Canada.\n\nWhile studying, Sweeny became an avid golfer and a close associate to Prince of Wales and future British king Edward VIII, with whom Sweeny would spend many a tour on various golf courses whenever the young prince was not preoccupied by his duties on behalf of the exiled British government. Sweeny further reinforced his status in high society after the young businessman married Margaret Whigham, the only daughter of the Scottish millionaire George Hay Whigham, of the Celanese Corporation fame. Thanks to Sweeny’s contacts in the New World and his experience as a lawyer and business, the Riffian mercenary venture has been largely funded by American and Canadian corporations looking to benefit from the opening of lucrative Riffian mining trade, especially when it comes to iron ore, phosphates and coal.\n\nEspecially the young king Edward VIII has been quick to capitalise on the successes of his friend, and while the Entente may not officially support the mercenary state quite yet, unofficial trades and contracts have been quietly signed and the number of British ships from various dominions and colonies frequenting the port of Tangier has nearly quadrupled overnight. The young Sweeny may have lived much of his life looking up to the grizzled veteran mercenary that is his uncle, but in the Rif, the contributions of the two men to the shared cause may be entirely different but equally vital for success."
RIF.267.a:0 "Not the war dog his uncle is, but a sly cub nonetheless."

RIF.268.t:0 "Direction of the New Dictator"
RIF.268.d:0 "With the choice made, Sweeny has now chosen the path that men he once viewed in great respect also had to travel. Influenced by Mustafa Kemal Pasha and Marechal Philippe Pétain, Sweeny’s new state shall be honed to perfection, so that one policy at a time, the Rif will be drawn out of its superstitious and barbaric ways into the light of enlightenment, and its noble people uplifted to accept their place among the civilised people of the world. However, what still remains to be determined is how Sweeny’s new state ought to be fully formalised, and what ideological father of the mercenary should be looked up towards as guidance for the statecraft, as despite his military prowess, Sweeny still lacks experience in governance.\n\nHe could, obviously, retain the more traditional merc state he has forged in the Rif, centralising the state under Sweeny’s rule but giving significant power to various local governors and mayors made up of members of the Rif squadron. Given his deep appreciation for history, Sweeny could also model himself after the American founding father, George Washington, advocating for a benevolent republican dictatorship that seeks to refine the institutions and functions of the new state under moderate, unifying figure. Alternatively, Sweeny could draw from his other homeland of France and model his state under the republican dictatorship of Pétain.\n\nThis would see him honour elements of local life and blend European civilisation with aspects of Riffian culture to create an ever-stronger union committed to uplifting both halves of the local population to ever greater heights under moderate nationalism, Sweeny’s own personality cult as El Coronel and agrarianism form-fit for the harsh local climate. Finally, perhaps more fittingly for the local people, he could take a page out of the policy book of Kemal Pasha and bring about a true transformation of local society under the five arrows, safeguarding it from the errors of the past while bringing it closer to the Ottoman model of governance."
RIF.268.a:0 "Retain Rif as the playground of mercenaries." 
RIF.268.b:0 "Washingtonianism shall reach even the shores of Africa." 
RIF.268.c:0 "Through National Revolution, Rif shall rise to greater heights." 
RIF.268.e:0 "Kemalist vision shall transform these lands to unrecognisable degree." 
RIF.268.f:0 "We shall drag Rif to modernity through strict authority." 

RIF.269.t:0 "Pathways of Democracy"
RIF.269.d:0 "The local Riffian parties were hardly enthusiastic when Charles Sweeny’s mercenary order reached out to them to pursue a democratic transition, but after long negotiations with parties that were more open to the veteran war dog’s proposals, a deal was struck. The heavily Salafist group led by Mohammed al-Makki al-Nasiri stayed out of the negotiations, seeing Sweeny’s commitment to secularism as a clear sign of treachery, but the reform-minded al‑Muslihūn group led by Mohamed Daoud as well as the left-leaning unionists of Partido Reformista Nacional, led in turn by Abdelkhalek Torres, were open to collaborate with the mercenaries as long as democratic principles and rights of the Riffian population were strengthened.\n\nAfter some deliberation, the former advisor of the Jalifa, Ahmed Belbachir Haskouri, also offered his services, being generally more progressive-minded while still representing the business interests of the Riffians. The government of Sweeny reached the agreement that for the first time, Sweeny would appoint the new head of government from the various options. Torres is by far the most radical option, being a left-wing nationalist with ties to various Pan-Islamist and Pan-Arabist movements, but he is also known for being highly pragmatic and politically flexible. He also has a fierce rivalry with al-Makki al-Nasiri, and could be kept on a leash in order to stay in power at the expense of his boycotting enemy.\n\nDaoud on the other hand is a highly learned and respected man, but politically relatively ambivalent and mostly focused on reforming various institutions, expanding education and advancing science in the region. Finally, the ‘Grey Eminence’ of the Rif, Ahmed Belbachir Haskouri, is a true political operator and by far the most experienced figure of the three, with large networks under his command reaching to the royal court in Casablanca, Egypt and Istanbul alike. While a schemer at heart, his immense political heft and knowledge of local affairs may be too good to pass on."
RIF.269.a:0 "Torres will be our man on the left." 
RIF.269.b:0 "The reformers of Dauod are harmless, choose them." 
RIF.269.c:0 "Belbachir’s experience is needed at a time like this." 

RIF.270.t:0 "Capitano Juanita"
RIF.270.d:0 "The family life of Charles Sweeny is a tale of tumult mixed in with the occasional period of stability and tranquility, which predictably ends when the wanderlust of Sweeny and his endless search for enemies of progress to decimate takes over. His first wife, Eva Mons, Sweeny met in 1910 while in France, and this marriage would bless the couple with three children. It was also Sweeny’s first period of peace ever since he had entered the mercenary business, one that the American soldier of fortune spent largely studying in Sorbonne as well as becoming an ardent Francophile, to the point that he began to consider the European nation his second homeland. However, Sweeny’s family life would be practically nonexistent for nearly a decade since the eruption of the Weltkrieg, and even as the war to end all wars wound down, Sweeny remained on the hunt for adventure and just causes to support, going around Europe as a war correspondent, investigator and mercenary until he ended up in the Rif region as part of Escadrille Cherifienne, fighting on behalf of the French once more though nominally under Spanish control.\n\nThe Rif war greatly damaged his reputation, and after the war he spent far more time with his family, but the Rif war also opened an old wound in the mercenary leader. Despite his marriage, at least according to the Tangier-based journalist, Sweeny’s personal love of his life was a woman known simply as Capitana Juanita, a Spanish mercenary Sweeny had met during his many participations into conflicts in Latin America. Harris claims that Sweeny’s personal feud with Abd el Krim stems from the rebel leader’s kidnapping of Juanita in 1910, though the records of such events in the Rif region are very nebulous, and the mercenary leader himself has chosen not to comment on the matter.\n\nPerhaps this silence is confirmation of Harris’ story, an attempt to create a mythos around the mercenary leader or genuine disinterest in such rumours, this remains unknown at present, but given the soldier’s track record when it comes to getting himself involved with the most peculiar crowds, the story may very well turn out to be true. For now, however, it is simply another footnote in the growing legend of Sweeny."
RIF.270.a:0 "Sometimes even a myth has a kernel of truth."

RIF.271.t:0 "The Men in Black"
RIF.271.d:0 "The many military ventures and foreign expeditions of Charles Sweeny have not gone unnoticed by the law enforcement agencies of the United States, especially after his escapades in the Rif war. The Rif conflict became a hotly debated matter in the Americas, with some Catholic forces supporting the Spanish government while many anti-Spanish or anti-imperialist organisations and individuals expressed deep distaste for the entire war and staunchly backed Abd el Krim. When Sweeny and other American aviators became involved, it caused a media uproar in the United States, with many calling them baby killers and other such harshly pejorative terms over the bombings of local tribal villages. Nonetheless, it was only after official American governmental intervention that Sweeny and his men were forced out of the Rif.\n\nWhen he began to clandestinely plan another foray into the Rif region in the service of the Spanish government in the mid-1930s, Sweeny made absolutely sure that the involvement of his mercenaries would be as secretive as possible. In the midst of the Great Depression and American turmoil, it was easy for the veteran wardog to recruit disillusioned or desperate military men, pilots and adventurers into his ranks, but such a massive recruitment drive among former soldiers could not stay hidden forever. The beginning of Sweeny’s pursuit was launched when he ran into an FBI agent in Algiers while visiting one of his favoured watering holes, an encounter which ended with Sweeny tossing the secret police officer onto the street. Hoover’s boys would hound him for years afterwards, trying to dismantle the Rif Squadron before it could become a reality to avoid another domestic, and possibly international, incident once more.\n\nHowever, with America in the midst of collapse and the FBI’s agents working overtime to put every nativist, syndicalist, Longist and various other brands of extremists behind bars, the long arm of the law has had its grip full for quite some time. As Sweeny’s new mercenary realm develops, however, it is clear that much effort must be placed in rooting out potential American infiltrators and agents of the Big Man hiding amongst the waves of refugees heading to Tangier and beyond. Whatever force emerges as the triumphant new power on the American soil, it will want to reel in the Moroccan soldiers of fortune in one way or another, and only through rigorous security and screening can these bloodhounds be driven out before they cause too much of a ruckus."
RIF.271.a:0 "Good luck with the arrest now."

RIF.272.t:0 "The Monocle-Wearing Mercenary"
RIF.272.d:0 "The new governance of Charles Sweeny has obviously had struggles moving away from a mere mercenary junta into an administration that can provide the services needed for the formation of a modern state. Nonetheless, as Sweeny has begun to fill out the slots on his new government, it has quickly become something of a league of extraordinary gentlemen, in both bad and good sense of the word extraordinary. One recent ‘minister’ on Sweeny’s colourful cabinet is one Alfred Wintle, a British officer whom the mercenary met during his many travels and participations into wars. Sharing the deep hatred of the Hun as Sweeny does, Wintle had joined the British military at a very young age during the Weltkrieg, being less than eighteen years old at his first sight of combat, which just so happened to be an artillery barrage that turned a sergeant of his unit into a shower of gore and petrified the young Wintle to the point that he could only stand and salute for the duration of the barrage.\n\nWhile an officer, Wintle shared Sweeny’s love for battlefield antics and famously captured a village in northern France on his own before handing it to the bemused New Zealanders who had been about to attack it. Like the leader of the Rif mercs as well, Wintle was grievously wounded by an artillery shell as he was manhandling an 18-pounder into position, losing his left eye, kneecap and several fingers, the explosion also leaving his right eye so badly damaged that Wintle has made a monocle his signature item now. Wintle was sent back to England to heal from his wounds, but this sedentary existence was not something the fierce young lad was content with, and Wintle attempted to escape the hospital to rejoin the fight by disguising as a nurse, only to be caught as his monocle compromised the disguise. Due to his low rank in the military and no particular political connections beyond his diplomat father, Wintle was not persecuted by the new revolutionary authorities, and spent much of the years between the Weltkrieg and present training French and British officers in the new republican armies.\n\nWhile not particularly interested in the revolution as a whole, he frequented liberal and moderate circles in the Union of Britain, coming to support the ideas of Clement Attlee. Nonetheless, his personal friendship with Sweeny and rather extreme boredom within the peacetime military of the Union of Britain made the veteran an easy recruit for the Rif squadron, even if the officer had no personal attachment to it unlike most other fighters within it. Despite his eccentric antics and rather abrasive nature, Wintle has quickly endeared the grizzled mercs to his side as the Brit continues to lead by example and never falters in the line of duty despite the injuries he has sustained over the years. Given his training as an artillery officer, Wintle has been training the Moroccan Regulares recruits in the handling of captured Spanish and Riffian artillery pieces, giving the new renegade state some much needed extra firepower to go alongside its tank and aircraft arms."
RIF.272.a:0 "Odd fellow, but I’m glad he’s on our side."

RIF.273.t:0 "Minas del Rif Under New Management"
RIF.273.d:0 "Charles Sweeny has always had a rather complex, though mostly negative, relationship with his father, Charles Sweeny Senior. Sweeny’s old man was much like his son in some regards, having run away from his home at a young age to enlist in the Union army, where he eventually landed in the cavalry unit of the famed general Custer. After the first American civil war was over, Sweeny Senior became involved in a plot to overthrow the Mexican emperor Maximilian, only for the mission to be thwarted by various circumstances. This was the man’s final foray into military life, and he soon found a calling in business life and, mirroring his son’s later trajectory, largely neglected his family to pursue ever greater profits and benefits to his company. However, when Sweeny Junior came of age, his father chose to make the teenager tougher and more fit for the harsh life in the turn of the century United States by sending his son to work in the mines of Idaho.\n\nLife in these mining settlements was hardly illustrious, and it taught the young Sweeny many lessons of both the rougher character within the human race as well as the importance of careful, methodical and hard labour in the shaping of men. However, as Sweeny was still young and overconfident, he also made the mistake of trying to woo the mistress of another miner, succeeding in his self-assigned mission but getting caught in the heat of passion, eventually leading to a saloon brawl that saw the teenager punched unconscious and thrown into the camp’s prison cell. This ended the prospector’s foray into the industrial mining career, and started his desires of a career in the military sector, as Sweeny clashed with his father and claimed to escape family life to join the American troops fighting in Cuba. The old mercenary has not revealed whether he ever actually ever ended up joining the American fight on the Caribbean island, but Sweeny did enter West Point at the turn of the century nonetheless, starting his trajectory that would one day lead him here to Rif.\n\nThis past has made him more sympathetic to the miners of Rif, however, and as the mercenaries of the Rif Squadron have taken over the mines that once belonged to the Spanish company Minas del Rif, Sweeny has passed sweeping executive orders to ensure that the labour rights, health standards and payments of the miners are brought to actually rather generous standards. The mining executives and various other company stooges protesting these changes have found themselves a target of the veteran wardog’s famous ire, with Sweeny going as far as to threaten the ‘soft-skinned pencil pushers’ with shifts in the mines if they consider the work to be so simple as to not necessitate a good and just wage. This has, suddenly, shifted the mood among the mine managers to be far more open in sharing the profits of the ore trading with the local workers as well."
RIF.273.a:0 "Could still be good to give them a few shifts, just to emphasise a point."

RIF.274.t:0 "Sons of the North in the Scorching Sands of the Sahara"
RIF.274.d:0 "The return of one of the most prominent Finnish soldiers in the Legion, Aarne Juutilainen, was met with much celebration by the old guard of the Legion, including the new temporary president of the Rif region, Charles Sweeny. Juutilainen had served for years in the Finnish army before joining the Legion, having become an officer in the mid-20s. However, his personality and habits made it difficult for him to conform with the norms of the standard army, and in 1930, he left for Algiers, seeking a new life in Africa. Juutilainen would spend long years hunting down rebels in French colonial territories, from the Tuaregs of the south to the Riffians of the north and bandit forces of the Atlantic coast, even helping pin down Communard infiltrators and Cyrenaican arms traffickers. These exploits earned him the nickname ‘Terror of Atlas’ after the Atlas mountains.\n\nHowever, his commission ended in 1935 and Juutilainen returned to Finland, putting his expertise to work in the army once more. Still, while the man is very popular among troops because of his unique leadership style and clear skill, his alcoholism is once again making things difficult within the army, and Juutilainen has mentioned the possibility of rejoining the Legion to begin officer training there soon if his troubles with superiors continued, and as could be surmised, they certainly did. Juutilainen, having plenty of experience fighting against the Riffians, was one of the first to volunteer to fight in the troops of Charles Sweeny, and has been instrumental in the training of Moroccan officers to fill the ranks of Sweeny’s new state.\n\nHowever, he was not the only Finnish Legionary in the ranks of the new mercenary state, for Lieutenant Adi Stenroth has joined Juutilainen in the dangerous mission of rooting out Abd el Krim and other terrorists such as him. Stenroth was a promising Finnish officer in the 1920s, but due to monetary troubles, left for Algiers to enlist in the Legion and fought fiercely in the Rif conflict to preserve the French colonial order from the rebels of Abd el Krim. He had great respect for Abd el Krim and his men, and for his actions, he was given the Croix de Guerre due to skill with leadership and combat prowess. One of Stenroth’s first actions after the defeat of Abd el Krim and the conquest of the Rif was to visit a particular location in the Rif region, a fortification named Fort Stenroth by the Legionaries, and to honour the first Finnish officer in the ranks of the French Foreign Legion, Sweeny has put Stenroth in charge of said defensive emplacement, hoping that the warrior continues his exploits in defence of his own castle just as fiercely as before."
RIF.274.a:0 "True warriors."

RIF.275.t:0 "The Killers"
RIF.275.d:0 "One of commander Charles Sweeny’s longest lasting friendships has been with the American author and adventurer Ernest Hemingway. The two wandering spirits met for the first time in the Ottoman empire, where both were observing the Caucasus conflict and Sweeny helped treat the writer when Hemingway was suffering from malaria. Hemingway became deeply impressed by Sweeny’s grasp of military strategy, and the pair stayed in touch over the years, drifting into the same conflicts every now and then, fighting side by side and earning each other’s deep respect in shared combat encounters.\n\nWhile Hemingway was almost seventeen years younger than Sweeny, he is often considered one of the few people Sweeny actually listens to, especially in the heat of combat, and according to the American author, it is because Hemingway can withstand the tirades and bursts of ire that Sweeny often launches at his allies, especially as things are going bad on the battlefield. The two men have managed to form a bond that transcends their abrasive and difficult natures, with Hemingway often remarking that he may very well be the only white man Sweeny gets along with, though the two frequently clash over military concepts, combat experience and other matters, only to make amends in the middle of the night after heavy drinking. Many of Hemingway’s characters in literature can draw their origin in the soldier of fortune, with Sweeny fitting the author’s romantic ideal of what a battle-scarred veteran and globetrotter should look, sound and act like.\n\nEver since the beginning of Sweeny’s reign in the Rif, Hemingway has made frequent visits to the region, often amusingly asking what the gun for hire needs his own personal realm for when he already has a Croix de Guerra and plethora of medals to go alongside it. The two men have also engaged in Hemingway’s favourite activities in the Atlas mountains as they stalk the wildlife by the mighty cliffsides, though on more than few occasions such hunts have turned into running battles with tribesmen from the remnants of Abd el Krim’s rebel army. Nonetheless, the presence and tacit endorsement of one of America’s most famous authors on Riffian soil has done wonders to the public image of Sweeny’s state, even if the squabbles of the two men have made government sessions almost impossible to stand for everyone else"
RIF.275.a:0 "Always a welcome guest in our little land of adventure."

RIF.276.t:0 "Little Civil War in Africa"
RIF.276.d:0 "The American civil war is raging on, and while Charles Sweeny and his mercenaries certainly have other matters on their hands to deal with, the arrival of thousands of American refugees to the African state and former pseudo-colony of Liberia has not gone unnoticed by the authorities in Tangier. While originally the mercenary government of the Rif cared little about what went down in the lands of Liberia, recent events in the region have forced a response from Sweeny’s soldiers of fortune. The Firestone corporation, known locally as a brutal and exploitative company that practically utilises slave labour from Nigeria, Westafrika and Equatorial Guinea to fuel its rubber extraction operations, has taken over Liberia, replacing the original black population the region was settled for after it was released from the grips of American slave owners.\n\nMost mercs in Sweeny’s realm care little for these happenings, and at best see this as a way to earn some extra money through new Liberian contracts, as Harvey Firestone, the company’s founder, is bound to have a need for some muscle in the years to come. Nonetheless, to Sweeny this new development posits some troubles. Firstly, given his near encyclopedic knowledge of the civil war, this cruel twist of fate where the descendants of African-American slaves are now once more dominated by the Americans is a rather difficult thing to live next to, even if Sweeny himself has settled on a mission to uplift the Riffians. Additionally, the large uptick in American government officials, military men and representatives of the various intelligence agencies so close to Sweeny’s illicit activities are bound to cause some trouble, especially as the old mercenary has butted heads with many of the American bureaucrats and politicians in the past.\n\nThe true nature of the new Liberian takeover remains a mystery for now, but with every passing day, Sweeny’s government dreads the actions the Liberian-Americans may take against the mercenary state in the Rif if they consider another American-led government a problem for their little exclave. As such, while many mercs are not particularly fond of striking the exiled Americans in Liberia, Sweeny is increasingly considering the option of eliminating the little American corporate adventure on the Atlantic coast to ensure the stability and security of his own ventures in Northern Morocco. Of course, the lucrative rubber resources of Liberia needed by his own Rif Squadron and their aircraft play no part in these invasion plans."
RIF.276.a:0 "We must end the Liberian nightmare."
RIF.276.b:0 "Do we really need a re-enacting of the American civil war here too?"

RIF.277.t:0 "The Multi-Talented Ace"
RIF.277.d:0 "The new mercenary government of the Rif may not have quite as many bloodthirsty mercenaries than the companies present in Congo or other parts of the Mittelafrika, and Sweeny’s gang of guns for hire can perhaps best be characterised as a band of drifters, men who perhaps if not for the circumstances plaguing the Americas may have had fruitful careers in less violent fields. One such figure in the new Riffian government is one Lansing Colton Holden Jr., another volunteer to the French cause during the Weltkrieg who later found employment within the Rif squadron. Holden was studying in Princeton at the time of the war to end all wars, having followed in his father’s footsteps in order to become an accomplished architect as well, but as he had a deep passion for flying, Holden found himself joining the fight against Germany on the French side, where he flew the famous Spad XIII fighter, mostly in observation balloon busting missions but also occasionally dogfighting with the German fighters.\n\nWhen the French collapse occurred, Holden escaped back to the Americas with seven aerial victories under his belt, finishing his studies in the early 1920s before the outbreak of the Rif war caused him to join the cause of the National France government. During the war, he flew in Sweeny’s unit and participated in numerous battles, earning a Croix de Guerre for his efforts, before the American unit was disbanded following pressure leveraged at Algiers from their national government seeking to uphold its isolationist stances. Holden had a brief foray in the film world of Hollywood, accompanying fellow flier Merian C. Cooper in the directing of numerous films, until the worsening economic situation left Holden without further prospects in the field. While the pilot tried to pursue another career in architecture, the Great Depression and its worsening effects caused by Black Monday dried up construction nation-wide in the Americas, and when Charles Sweeny appeared on Holden’s doorstep with another offer to fight in the Rif region, the pilot had few options but to pursue a life of a mercenary once more.\n\nNonetheless, after the pacification of the region, the fighter ace has been following his passions in architecture and film-making, mingling with the numerous American refugee actors, film directors and producers with the intent on creating a little Hollywood in Tangier as well, capitalising on the cosmopolitan and bohemian nature of the city mixed with the plentiful amount of gruff mercenary extras they have at their disposal for war films and adventure flicks. Holden has also fully embraced the art deco boom of Tangier, designing new offices and barracks for the armies of his commander Sweeny with only the most cutting-edge materials and design ideas in mind. When he isn’t on the skies above the Rif ensuring that the new state is protected by the vultures of the Squadron, Holden is creating a new slice of America on North African soil at an impressive rate."
RIF.277.a:0 "America reconstructed by a single man."

RIF.278.t:0 "Royal Renegade of the Rif"
RIF.278.d:0 "When the mercenaries of Charles Sweeny and his Rif squadron first entered the city of Tangier, led by columns of French-supplied armoured carriers manned by veterans of the French Foreign Legion, the marching troops were greeted by another Legionnaire, Prince Aage, Count of Rosenborg. Member of the Danish Glücksburg royal family, Aage entered the Danish military before the Weltkrieg and was transferred to Italy to act as an observer in the region during the early years of the war, meeting his future wife d Matilda Emilia Francesca Maria Calvi, for whom Aage would give up his right of succession to the Danish throne for, though he did nonetheless retain the moniker of Prince and Count of Rosenborg. He also travelled to France and the United States during the war, only to return to Denmark at the end of the war to resume his duties in the Life Guards, earning the rank of captain while maintaining a popular reputation among his men.\n\nHowever, a tragedy struck in the form of the collapse of Landmandsbankens, one of the central banks of Denmark, and with it, most of Aage’s wealth was wiped out, forcing him to give up the career as officer as the Danish army did not pay its commanders a salary in the usual sense. Seeing few options out of the crisis but still intent on living the life of a soldier, Aage requested the King of Denmark, Christian X, for the permission to join the French Foreign Legion in 1922, and was approved, joining the prestigious but harsh force with the rank of captain. Again earning a reputation as a competent and popular officer, Aage was respected by the various nationalities under his command, his company containing men from seven nations in total.\n\nDuring the Rif war, the prince earned a promotion to intelligence officer, given his numerous forays into the areas controlled by the rebel leader Abd el Krim, and in one particular scuffle, a Riffian tribesman managed to shoot him into the leg, eventually earning the royal a Croix de Guerre for his services. As the combat in the Rif waned down, Aage became a member of the general staff, and once the war ended, he was awarded Légion d'honneur alongside a promotion to lieutenant colonel. While the Danish royal has been retired from the Legion for quite some time now, he nonetheless stayed in the Rif, living a life of luxury in Tangier, and while he did not actively participate in Sweeny’s takeover of the region in military fashion, the prince did provide much needed intelligence and reconnaissance data of the movements of Abd el Krim and various other forces in northern Morocco. As a result, some members of the new mercenary state have suggested promoting the old colonel into a honorary rank of general in the Rif squadron, both to boost morale and also pay respects to the old warrior."
RIF.278.a:0 "Absolutely, give him the rank."
RIF.278.b:0 "Perhaps it’s best to let him enjoy retirement in peace."

RIF.279.t:0 "Call of the Adopted Homeland?"
RIF.279.d:0 "Throughout his life, Charles Sweeny has claimed to have been fighting to destroy dictators, despots and other enemies of freedom. However, many within his entourage have noted that his one blindspot has always been the French president Philippe Pétain, lion of Verdun and the great Marechal of France, whom Sweeny has deeply admired since the Weltkrieg. Nonetheless, even this admiration has began to fade with the close coexistence of the Riffian mercenary state and French National State, and as the French government has become increasingly authoritarian in its single-minded pursuit of reclaiming the metropole, Sweeny has been alienated from the French values and ideals that he once considered so strong and appealing that France developed into something of a second homeland for him. Increasingly Sweeny is beginning to doubt whether his allegiance is to the rapidly evolving and distant Algiers regime, or to the spirit of the French republics instead.\n\nThis doesn’t mean that Sweeny is particularly fond of the Communards either, as their movements tend to be rather internationalist, or in the other end, so rabidly totalitarian as to mirror the fanaticism of the French nationalists in Northern Africa. As the mercenary leader struggles with this dilemma, a part of him has even considered the possibility that it is his duty as the adopted son of France to bring order, justice and freedom to the two squabbling states that have forgotten the true path after such a long separation. This new state that Sweeny sometimes finds himself dreaming of would mix his own American background and the best parts of the United States political system, such as the federalism and presidentialism, with the love of liberty, secularism, political plurality and fierce resistance to government overreach that the French are famed for.\n\nHowever, the soldier of fortune is fully capable of realising that such a reclamation would be a Herculean affair, and as such his considerations have thus far merely been the daydreams of an otherwise highly stressed and worn man, but if the new commandant of the Rif chooses to entertain them, it could have gigantic consequences to the stability of Northern Africa in general."
RIF.279.a:0 "We must save both Frances from themselves, the Rif shall save the empire!"
RIF.279.b:0 "It is best to give up on such daydreams."

RIF.280.t:0 "Unhealthy Competition"
RIF.280.d:0 "The collapse of Mittelafrika has been one of the most momentous events in the world even amidst the globe-shaping developments that define the current era. For the Riffian mercenaries, it has been a time of immense profitability as new African nations, colonial enclaves and various warlords all scramble to gain the upper hand in the confusing and lethal battlefields of the African jungles and savannahs. However, as Charles Sweeny’s warriors have journeyed into the very heart of Africa on behalf of their clients, they have been met with fury and flame by rivals from the mercenaries of Congo, led by a smattering of leaders from the harsh and ambitious Hallström brothers to the French dreamer Jacques Massu all the way to the gallant pilot war dog Carl Gustaf von Rosen.\n\nThe clashes between the North African squadronists and the Congolese guns for hire have been rather violent and devastating to both sides, and many good men have been lost in the jungles of Central Africa from the veterans and recruits of Sweeny’s companies. The profits to be made in the ruins of Mittelafrika are enormous, so the current situation of competition cannot remain. Given the rather safe status of the Rif mercs, and the rather hectic and precarious situation of the Congolese mercenaries, striking the southern rivals now and putting an end to their actions on behalf of clients opposing the customers of the Riffians would be a massive boost for the ventures of Sweeny’s company, and the strength imbalance might make the battle an easy one.\n\nHowever, having an ally in control of the numerous resources and facilities of the Congo with a similar vision could be an equally potent tool, and the mercenaries of the Congo could likely be brought into such a profit-sharing arrangement with some diplomatic overtures. Finally, should one of the more reasonable mercenary leaders emerge as the commander of their small empire in the rainforests, Sweeny is not necessarily opposed to merging the two profitable ventures of the mercenary clans under one banner, sharing power with the Congolese soldiers of fortune and creating a continent-spanning force that the world has never seen."
RIF.280.a:0 "Strike now, and we can decimate these layabouts!"
RIF.280.b:0 "Perhaps we can offer an alliance to them?"
RIF.280.c:0 "Von Rosen shares the humanist motivations of Sweeny, offer a state union to him."
RIF.280.e:0 "Let us just ignore them for now."
