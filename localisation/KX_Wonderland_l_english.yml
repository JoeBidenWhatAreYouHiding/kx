### Events ###

wlandevent.1.t:0 "The Recent 'Rust' of Michigan"
wlandevent.1.d:0 "Undoubtedly the most important Great Lakes state in the USA, as well as a major hub for industrial production coupled with unionist activity, Michigan could easily be described as the second 'jewel' of the nascent Combined Syndicates after the capital zone in Chicagoland. While the area around Detroit itself was quickly secured following the declaration of the Second American Revolution, the relative remoteness of the different cities and towns of both the 'Mitten' and the Upper Peninsula have proven to provide a considerable challenge when it comes to extending our authority.\n\nWhat's more, the process has not been without a significant opposition in the form of enemies both internal and external. The former represent the forces of the capitalist order and reaction, such as the Fordists of Dearborn or the Klanist chapters rampant across the Southern part of the state. What's more, the vile bootlickers of the British crown, stuck in Canada after our British comrades dislodged them a decade prior, have already started conducting small scale actions to disrupt the shipping zones across the Lakes through acts of sabotage and cross-border infiltration.\n\nAll of this has led the smaller businesses of the Steel Belt, of which there are many and which we still lack a particular vision for, to suffer from rampant petty crime and general societal breakdown worse than the one present under Hoover. Bankruptcy, severed supply lines, break-ins, vandalism, extortion - all kinds of behaviors which must be culled under Socialism - have been slowly eroding the confidence of Michiganders living in places like nearby-Detroit's Brighton in the new Syndicalist Congress and its representatives. Something must be done sooner or later to reinforce the rule of law, one that is just and serves the people, if we are to serve the laborers of all strides and safeguard them from the old menaces lurking in the shadows."
wlandevent.1.a:0 "This all is just... one big uphill battle we have to overcome."
wlandevent.1.b:0 "I don't know what's happening anymore."

wlandevent.2.t:0 "Downtown"
wlandevent.2.d:0 "It seems that our confusion and lack of appropriate action thereof has resulted in the entrepreneurs of Michigan taking an active stance against the new administration. Tired of the seemingly endless string of humiliation, and supposed favoritism towards the factory-industrial sectors dominated by trade unions and the politicians which feed on them, the moms, pops, and managers have set out to find someone who could lead them towards a safe and secure future.\n\nNot wishing to merely replace one socialist figurehead with another, or exchange the Syndicates for the return of Federal tyranny or the demonic hooded Dixiecrats, the people of the largest Great Lake state under our control have instead elected to turn to one of their own.\n\nJack Walten, an immigrant from Chile who settled in the forgotten city of Brighton, has been thrust into the highest office by the needy population of his beloved Livingston County and the wider Detroit area. Both a family man and a valued member of the local community active in various charitable causes, Mr. Walten is the co-owner of the Bon's Burgers diner together with his associate, Felix Kranken. Only time will tell if he's strong enough to deal with this new and precarious position Michigan finds itself in."
wlandevent.2.a:0 "Let us bring your family together the right way."
wlandevent.2.b:0 "I don't think we're helping each other."

wlandevent.3.t:0 "Aftonbuilt"
wlandevent.3.d:0 "With the cooperation between our industrial sector, especially its military branch, and Afton Robotics yielding many positive results, we are now being pushed towards reconsidering the initial scope of our deal with the subsidiary of Fazbear Entertainment. As much as some of our soldiers, at least the ones with children who are in awe of the new animatronic companions to their dads, might appreciate what William has done for us, the old captains of industry remain unimpressed.\n\nNonetheless, Mr. Afton has submitted an official request for the expansion of the military robotics program, citing the overwhelming need for effective units capable of operating non-stop no matter the conditions they might find themselves in. On this front he is supported by another genius in that field, Phineas Taggart, yet such a stance is rather rare among those concerned with the future of Afton Robotics. The board of directors at Fazbear is urging us to keep William's ambitions in check and solely limited to a supporting role, mentioning certain design choices which are hard to understand and were never explained by their creator."
wlandevent.3.a:0 "Very well, let him loose."
wlandevent.3.b:0 "Limit his ambitions."

wlandevent.4.t:0 "Waiting on the Syndicates"
wlandevent.4.d:0 "Despite the forces of the Combined Syndicates announcing a temporary retreat from the entire state of Michigan, including the Upper Peninsula much to our surprise, it is clear that this situation will not be able to be sustained beyond a short period of 'grace'. The Syndicalists will attempt to return to reclaim what they believe is theirs, not to mention any other forces that might attempt to capitalize on this shifting of the balance of power around the Great Lakes. We must prepare ourselves and defend the future in which we can all believe."
wlandevent.4.a:0 "It is time."
wlandevent.4_tooltip:0 "§RWar will break out with the CSA in 75 days.§!"

wlandevent.5.t:0 "The War for Michigan"
wlandevent.5.d:0 "It is as we feared, the Second Continental Army has started an all-out offensive to recapture the entire area of Michigan now under our control. With the Federation back against the wall nothing remains but to fight until we are free to pursue our promised vision."
wlandevent.5.a:0 "The time is up."

wlandevent.6.t:0 "My Soul"
wlandevent.6.d:0 "As the American strife continues we all go through hardships, be they more global or simply personal. Michigan has been a hurtful place to exist in, something that has been laying heavy on Jack Walten's mind. How could he be capable of protecting not only his family, but all families that trust in his leadership, with the shadows of the past constantly assaulting his vision? However, what forced the co-proprietor of Bon's Burgers to reevaluate his stance was seeing the awful state his wife, Rosemary, was in.\n\nA sensitive soul, Rosie has long worried about the future in which Edd, Molly, and Sophie Walten will have to grow up. Will they ever find happiness in a world as broken as the one the entire Bunny Smiles family finds itself in now? What is going on right now, it can be scary, but we'll pull through in the end.\n\nStarting from making sure that his own family, including the employees that have been with the BSI through thick and thin, are secure; Jack Walten now turns his attention to creating a safe haven for everyone under his guardianship. This 'Wonderland' scheme shall gather the best across the entire state in an effort of making places of wonder, where kids and grown ups can forget the pain of reality. It might seem like a lot, but Mr. Walten is more than capable of handling it all on his own, at least until Felix Kranken is capable of helping out when his mandatory alcoholism rehab is over."
wlandevent.6.a:0 "It's time to start living again."

wlandevent.7.t:0 "Where is Jack Walten?"
wlandevent.7.d:0 "It seems that no one can escape from being tested in these dark times. With the horrors of the American collapse ever present in the minds of all citizens of Michigan, it would be easy to forget about the ordinary tragedies, the small slashes which shall never fully heal. Jack Walten thought he could escape them, prevail in the face of grief, yet he ultimately succumbed to the cascading tragedies that struck his family.\n\nBefore the foundation of the Free Federation came the hunting trip incident, something that ultimately drove Felix Kranken to the bottle and eventual divorce from Linda. Both of these would lead to the greatest tragedy of them all, when a man once thought of as a family friend carelessly drove little Edd and Molly Walten into their deaths and buried the evidence. Then came the disappearance of his two best employees, Susan and Charles, not to mention the mental deterioration of Rosemary - Jack's beloved wife.\n\nMr. Walten would leave his post, leave everything that he has built so far, never to be seen again. Last reports that we were given by Rosie, in a state of absolute shock, told of how 'God was testing them both' and how everyone should forget about him. Mrs. Walten would soon perish too, and join someone else in his Wonderland. In the absence of Jack, the future of our Michigan, a state to be made beautiful, falls into the hands of 'Bon', Bon the Hare."
wlandevent.7.a:0 "I am in control."

wlandevent.8.t:0 "The Technological Gateway"
wlandevent.8.d:0 "It seems that, despite their work only seemingly just beginning, REGNAD Computing and their various partners are already confident enough to show off the advancements their research methods have resulted in. As part of a series of monthly progress reports the organization has vowed to continue until 'their client is satisfied'; a team consisting of the manager Duncan Parnell, the organizer Kennedy Silva, and the Artificial Computer Learning manager Alexis Moore, has outlined the tangible benefits of their work.\n\nIndeed, their goal of 'predicting and preventing future technological failures' and 'advancing in the field of technological discovery, especially computer processing and memory' has resulted in an increase of research capabilities the likes of which none of our other scientists have witnessed before. From simple prompts and answers, through basic task solving, and even ending at a generation of other worlds captured in form of 'games' and films, the Computing team has delivered all they have promised, and then more. However, we have received distressing reports of one of the 'ACL' facilities being overrun by some sort of a growth and then promptly abandoned, a mystery about which we still have not heard anything from REGNAD itself."
wlandevent.8.a:0 "We should definitely keep an eye on this."

wlandevent.9.t:0 "Dress Sharp"
wlandevent.9.d:0 "The grown ups have to work, just got to take care of something small."
wlandevent.9.a:0 "Just the suit."
