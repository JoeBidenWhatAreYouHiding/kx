### Decisions ###

WLD_lacey_businesses_category:0 "The Real Girls' Business"
WLD_lacey_businesses_category_desc:0 "The landscape of our state, at least when it concerns the economy, has been quite dire for a while. But there is no need to worry, as we are capable of making lots of new and amazing establishments, with none of the faults of those that came before. These are, after all, real business, by real girls."
WLD_lacey_diner:0 "Lacey's Diner"
WLD_lacey_diner_desc:0 "Lacey is about to open her brand new diner! However, she will need your help to keep up with so many hungry customers!"
WLD_lacey_makeup_parlor:0 "Lacey's Makeup Parlour"
WLD_lacey_makeup_parlor_desc:0 "Everyone loooves feeling pretty, and Lacey is here to help with her super awesome makeup skills! Use your creativity and imagination to give clients makeup looks to die for!"
WLD_lacey_petshop:0 "Lacey's Petshop"
WLD_lacey_petshop_desc:0 "Lacey has one of the most famous pet shops in town! People from all over come to buy their perfect little furry companion, and it will be your job to help her today!"
WLD_lacey_house_makeover:0 "Lacey's House Makeover"
WLD_lacey_house_makeover_desc:0 "People cannot live in their old houses, and that's where our go-getter Lacey comes in! Help our thrifty entrepreneur renovate the homes of anyone in need across the town!"
WLD_lacey_backrooms_civilian:0 "Jay & Maisie's Workshop Expedition"
WLD_lacey_backrooms_civilian_desc:0 "It would be a shame for all the appliances to get lost among the beige walls, and that's exactly why Jay and Maisie must find useful items wherever they go!"
WLD_lacey_backrooms_military:0 "Jay & Maisie's Materiel Expedition"
WLD_lacey_backrooms_military_desc:0 "Jay and Maisie might feel somewhat out of depth in this one, but what won't you do for a friend! Lacey has asked the pair to explore the Backrooms in search of certain dangerous materials!"
WLD_lacey_backrooms_navy:0 "Jay & Maisie's Aquatic Expedition"
WLD_lacey_backrooms_navy_desc:0 "It's time for Jay and Maisie to venture into the Poolrooms! Maybe they will even find the legendary almond water, or learn navigational skills from Captain Clark himself!"

WLD_wonderland_military_category:0 "To Defend Our Masterpiece"
WLD_wonderland_military_category_desc:0 "This 'Wonderland' of ours, is a true masterpiece. A new home for all those left behind by the world that abandoned them. We must do everything, no matter how high the cost gets, to preserve this paradise. Thankfully, there are many skilled men and women willing to sacrifice their team and resources for the benefit of all."
WLD_peterson_trenches:0 "Plant the Congregentur Carnis"
WLD_peterson_trenches_desc:0 "Recently, we have discovered a plant-like 'meat' bulb capable of covering a considerable area in sharp-hooked tendrils. While these 'harvesters' are harmless to smaller organisms, they have been observed to specifically go after bigger targets like bears, wolves or even humans. We should consider utilizing their combined toxic and blood clotting abilities in our defensive lines."
WLD_peterson_mass_armaments:0 "Mass Arms from Murray Co."
WLD_peterson_mass_armaments_desc:0 "Founded by a man who previously had dealings with Mr. Afton and now ran by his son, Edwin Murray, the Murray Company became known far-and-wide for a range of smart household appliances. With their factories already geared towards the mass consumer market, it would be relatively simple to convince both Edwin and his wife Fiona to enter a partnership with our government to produce cheap and effective guns for general distribution."
WLD_peterson_cannons:0 "'Neighborly Greetings'"
WLD_peterson_cannons_desc:0 "If there is one thing Theodore Peterson is knowledgeable about, that is surely how to use even the most drastic measures to keep unwanted guests away from his abode. Let us follow his suggestion of organizing 'greetings' towards our enemies by using artillery pieces recovered from various museums and private collections."
WLD_film_propagation:0 "Propagate Analog Terror"
WLD_film_propagation_desc:0 "The wonders of new technologies are abundant, and thus the broadly understood analog format can prove to be greatly useful to our martial aims. We shall distribute various movies, recordings, and other forms of capturing the unknown to both inspire our men and demoralize their opponents."
WLD_bump_in_the_night:0 "Bump in the Night"
WLD_bump_in_the_night_desc:0 "By mimicking the behavior of various ghosts, ghouls, and all manner of nocturnal creatures we can transform our troops into a tool of menace. Whenever night falls, our enemies will have to contend with ceaseless strikes which will turn their entire lines into mindless insomniacs."
WLD_charting_the_beyond:0 "Expand the Cthonaut Program"
WLD_charting_the_beyond_desc:0 "It has become increasingly clear that our state is home to multiple locations one could deem, 'supernatural'. While many are ultimately harmless, we cannot be sure of that unless these zones are thoroughly checked. This is why we must turn to the nascent Cthonauts, explorers of the 'underworld', and provide them more resources to chart the realms beyond the veil."

WLD_danganronpa_category:0 "Refuting the Bullets"
WLD_danganronpa_category_desc:0 "It might seem like a total mystery how to survive in the world full of distrust, but two forces have found a way. It remains to be seen which of them produces a better result, but as adversity is thrown at us by those trigger happy enough to shoot, we must do everything to regain internal harmony."
WLD_dangan_hope:0 "Rely on the Future Foundation's Help"
WLD_dangan_hope_desc:0 "The Future Foundation's allegiance to our government means we are at liberty to have them aid our state, provided we can fund them. Their goals of creating a brighter horizon and eroding despair at the heart align well with our own, and will surely make our citizenry all the more happy."
WLD_dangan_despair:0 "Use Ultimate Despair's Methods"
WLD_dangan_despair_desc:0 "Our clandestine accord with Ultimate Despair allows us to call upon their assistance in governance, should we wish it. While letting Junko Enoshima run a little wild will undoubtedly drive many citizens to their limits, that might be exactly what we need to make our state ultimately stronger."

WLD_portraits_category:0 "Looking the Part"
WLD_portraits_category_desc:0 "As should be natural when it concerns anyone leading an endeavor as grand as ours, they must present themselves right in hopes of inspiring the masses to follow them. Perhaps a rather unimportant aspect to consider, but intriguing nonetheless."
WLD_jack_portrait:0 "Jack's Photo"
WLD_jack_portrait_desc:0 "Seeing as he is the main proprietor of Bunny Smiles Incorporated, it would be wise for Mr. Walten to pay special attention to how he presents himself in the realm of photography."
WLD_bon_portrait:0 "Bon's Canvas"
WLD_bon_portrait_desc:0 "When the past self no longer exists, one can reinvent themselves in any way they want. That is how one can become truly beautiful."

WLD_little_bons_america_category:0 "Little Bon's America"
WLD_little_bons_america_category_desc:0 "Just like the children's show developed by the Rose of the Waltens, we too must now teach the lost people of the United States that there is no reason to be sad. They might have lost their old home, but they have made many new friends along the way, and can be all happy together."
WLD_Core_America:0 "Bring Joy to [FROM.GetName]"
WLD_Core_America_desc:0 "With us establishing control over [FROM.GetName], the time has come to introduce our fellow men and women to what we have been working on. No longer threatened by war or tyranny, they shall discover the joys spilling forth from 'Wonderland'."

### Focuses ###

WLD_Wonderland_Intro:0 "Welcome to Bon's Burgers"
WLD_Wonderland_Intro_desc:0 "It is no secret that our position is nothing short of precarious, with every single post-American state having far larger economic potential and military establishment. The decoupling of Michigan from the Combined Syndicates of America, too, has caused an enormous deal of headache for the local administrations previously reliant on the interconnected systems in the Great Lakes area. Nonetheless, the spirits remain quite high owing to the new leadership of Jack Walten.\n\nIf he, a humble migrant from Chile, was able to form a happy family and establish a successful business, then there is nothing other people following his example won't be able to accomplish. Let us work pridefully in harmony to bring the best life to everyone, starting from the home of the Bon's Burgers - Livingston County - and ending up on both of the shining American coasts."

WLD_WR1:0 "Those Good Moments"
WLD_WR1_desc:0 "It would be easy to lose hope in times like ours, for every single day brings new horrors that surface or even resurface from the darkest days of our past. Be it the constant reports of battlefield losses and innocents left with nothing, or more personal reasons. Our own leader had many days in which he almost succumbed to the shadow that has been nibbling at the corners of his company for some time, yet he persisted - remembering about the good times when then Bunny Smiles Company was first formed prior to the Technology of the Future fair.\n\nWe should focus on what can keep anyone going through such hardships, that you can always make something good out of a bad situation. Let us harness the creative energies of various artists, entertainers, and other peculiar figures to provide spaces of joy and kindness amidst the chaos. A true 'Wonderland', for children and adults alike."

WLD_Umi:0 "The Legend of the Golden Witch"
WLD_Umi_desc:0 "We have been recently approached by a fair woman who only identifies herself as Beatrice, although according to the few reports we were able to gather she is also known among local populace as the 'Golden Witch'. While America has always had a fair share of its own tricksters, this woman is no ordinary magician or even a sorceress, as she seemingly possesses abilities which cannot be explained beyond citing vague arcane rituals originating from a distant island.\n\nNot only will our enemies fall into a state of confusion before such esoteric displays, but our own people will slowly begin to manifest a belief in the magical world, further helping us in establishing 'Wonderland'. What Beatrice herself describes as 'taking people to the Golden Land' is already bearing fruit, with papers focused on odd phenomena and not the hurtful present."

WLD_IB:0 "Painting the Fabricated World"
WLD_IB_desc:0 "Recently, a talented young girl has become a protégée of Mr. Walten's wife, Rosemary (herself an accomplished artist and one of the kindest people you could meet). Ib, as the little genius is called, seldom talks to communicate with the world, preferring to let her paintings do what words would fail to accomplish. These works have been noted to create a feeling in the viewers as if they were 'transported' to a different, much more vivid and vibrant reality.\n\nEven if the full effects of such a dream-like state are unknown, utilizing such an opportunity would greatly benefit the 'Wonderland' and allow us to construct a genuine alternative world. If we do not lose our way and are aware of our surroundings, then this new gallery shall serve as a gateway to a better tomorrow."

WLD_WR2:0 "Beauty is Pain"
WLD_WR2_desc:0 "Jack was not a strong man, no matter what he might have claimed to his own daughter and wife. With every single day of living with a hidden guilt from the past, exacerbated by the slaughter of the Civil War he had to now witness, something had to finally give. God was indeed testing the Waltens, and they have failed. But the shadow following closely behind knows what to do, to make everyone beautiful.\n\nFor what are flawed people if not slates to be broken apart and corrected. 'Bon' will stop at nothing to ensure that the functionless are reborn in Wonderland, like a butterfly bursting from a cocoon. Many will struggle, but the initial hurt is necessary. After all, what good is living when you are already dead."

WLD_SH:0 "Through the Otherworld"
WLD_SH_desc:0 "The lakeshore areas are home to many foggy zones hiding a secret passage, one that leads to a wonderful zone of purification. This 'Otherworld' presents itself before individuals and communities alike that are inacapable of dealing with the nightmares they experienced prior. Thanks to the markings left by an ancient order, the 'Halo of the Sun' can serve as a guide to this reverse side.\n\nUtilizing the creatures birthed from this dimension, we shall transport everybody who has a soul that cannot pass on yet to be cleansed. What form will such activities take, no one can be sure, but there is no reason to be scared on your way to Wonderland."

WLD_MC:0 "Not the Real You"
WLD_MC_desc:0 "It seems that our meddling with the nature of humanity itself has caught the attention of a certain power from the heavens, or at least what he claims. The Observer, as he humbly described himself,  appeared before us in form of a magnificent archangel - taking on the role of the highest ghost. As far as those aware of his ilk are, the 'Alternates' under his command have been with us for far longer than many are aware.\n\nHumans are flawed creatures, and thus those who do not heed our words and fight against being 'deceived' shall be simply replaced, as there is only place for one of us in Wonderland. Thus, as they wake up they shall all dance on the stage set for them, transformed by exploiting their greatest fears."

WLD_DGR:0 "Between Hope and Despair"
WLD_DGR_desc:0 "Hope and Despair, a world governed by two eternal emotions - that is the realization we have come to as we build our new paradise. Naturally, the denizens of America fall into both of the camps, either holding out for something better to come after all is over, or giving up and relinquishing control to the terrors beyond understanding.\n\nWe have been made aware of two groups with knowledge far exceeding our own in those fields, Future Foundation and Ultimate Despair, neither of which is too keen to cooperate with each other. However, we can still establish links with both, depending on what the current situation calls for, even if their methods are controversial."
WLD_DGR_tt:0 "§uThe tools of either a Bright Future or an Ultimate Tragedy will become available.§!"

WLD_MM:0 "Devise the 'Canyonggalan' Airships"
WLD_MM_desc:0 "Our forest services have recently stumbled upon something that could turn around the tide of the aerial war in our favor. The so-called 'Giza Glass', first documented in far-away Egypt and then traced to America's own Grand Canyon, is still poorly understood beyond its method of formation being established as lightning strikes.\n\nNonetheless, weapons made of this material are said to cut through anything, with tall tales of human heads severed by it swelling to enormous balloons capable of flight. We should use the glass, as we are in no position to deliberate on if that is a right thing to do or not."

WLD_HN:0 "Mister Peterson's Neighborhood"
WLD_HN_desc:0 "Owing to the size of our state's national guard, quickly mobilized into an army, we cannot hope to protect all of our citizens equally. That is exactly why they will need to be trained in how to deal with any force trying to occupy Michigan, in spirit of our forefathers defending their homes.\n\nIt just so happens that we know a man who is already experienced in such matters, Theodore Peterson, as he had to fend off trespassers for years. If we manage to spread his ideas on how to fortify houses, and utilize various common objects to fend off invaders, every hostile will surely steer clear."

WLD_WA:0 "Flesh, Steel, Joy, Creation"
WLD_WA_desc:0 "Among the various companies that have offered their help in reconfiguring their production for military means is Afton Robotics, previously known for constructing various basic animatronics to entertain people. Its founder, William Afton, has ensured that the factories and engineers at his disposal are ready to fulfil any order our army might have.\n\nHowever, his ambitions have grown beyond being a mere helping hand, even if the plan to deploy morale boosting 'robots' to the front was already accepted. Time will tell what the visionary man clad in purple has planned to present to the world."
WLD_WA_tt:0 "§hThe Pizzeria's classics will be ready for showtime!\nVarious new 'generals' will join our forces.§!"

WLD_RE:0 "Our Own Stars"
WLD_RE_desc:0 "The Special Tactics and Rescue Service, our dedicated intelligence agency, has served us quite well so far. Yet their work never ends, as new strange occurrences tied to things many claim to not be natural, as well as foreign infiltrators, demand renewed effort in combating malignant presence wherever it appears.\n\nWe must enlarge the resources available to the S.T.A.R.S. so nothing escapes the agents employed by our state. This could be coupled with a much deserved promotion for one of its core members, as well as the hiring of foreign experts no less skilled than our current cadre."

WLD_RNG:0 "Deluge of Wrathful Spirits"
WLD_RNG_desc:0 "The world of electronic warfare is not fully understood yet; perhaps that's why our enemies are having so much trouble with it whenever operating in our territories. There are, of course, those that will retell the same old tales about spirits of grief and anger, now latching themselves onto analog communication, but surely those are not real.\n\nThe psychological effect of such thinking is real, and it could be exploited by our troops. The time has come to become the bogeymen; the ones that try to oppose us will fear. Then they will have no other choice but to either run, or cover, and be left defenceless."

WLD_ROD:0 "Legacy of Captain Witterel"
WLD_ROD_desc:0 "With us reaching the Eastern Seaboard the previously miniscule and very provisional naval forces of the Great Lakes are standing before a much greater challenge. The question of how to protect the vast coastline of America, without pre-existing infrastructure being with us from the very start, has been causing countless debates among our admirals.\n\nUltimately, a brilliant solution was proposed, one built on the tales of various ghost ships disappearing and haunting those unprepared for their re-emergence. Be it the famous 'Mary Celeste', or the much more obscure merchant ship 'Obra Dinn' commanded by the Englishman Robert Witterel, these vessels shall serve as a model for our modern leviathans."
WLD_ROD_tt:0 "§7New ships constructed according to particular specifications will join our fleet.§!"

WLD_SFD:0 "Securare-Continere-Protegere"
WLD_SFD_desc:0 "Secrets cannot be kept that way forever; that is why there are people in this world that must maintain vigilance so others can remain unbothered. Such was the situation with the Federal government's former allies, now knocking at our doors due to the large increase in reports of unusual things spotted across Michigan.\n\nThe Special Containment Procedures Foundation shall serve in the darkness to protect our light, using the shared tools and means to catalogue and secure any species or object deemed too anomalous - something that shall also benefit our scientific base."

WLD_GHE:0 "An Iris on Intelligence"
WLD_GHE_desc:0 "The field of computing is something that, while slightly explored by CyberFun Tech and other similar companies like Fazbear Entertainment or Murray Co., is still relatively new and ill-understood. Thankfully, a new group has appeared and offered its services after our government seemingly caught its attention.\n\nREGNAD Computing claims that thanks to generous funding from their mysterious client they will be able to accelerate our technological development beyond what was seen with human eyes before. All they ask for is to trust them; in exchange, we shall receive truly off-world communications in the field of constructed intelligence."

WLD_LG:0 "Lacey's Small Start-Ups"
WLD_LG_desc:0 "Since the flight and collapse of the larger sectors, the financial lifeline of Michigan became centered around small and medium enterprises. While the few larger corporations remaining are entirely focused on the current war; the ailing diners, mom-and-pop shops, and others require immediate attention.\n\nAs much as some might see merit in maintaining Mr. Kranken's overseership of this economic area, a change is clearly needed. We shall put a true prodigy in charge, a fun-loving girl ready for any adventure. Even if some are concerned that Lacey might be a bit easily distractible at times, she can become very determined when the occasion demands it."
WLD_LG_tt:0 "§MWe will be able to improve our economy further using Lacey's various investment schemes.§!"

WLD_BR:0 "All These Rooms"
WLD_BR_desc:0 "As the various trade unions and reactionary businesses left their facilities in Michigan without anyone to claim them, these buildings fell into disrepair and ended up being easy targets for vandals to prey on. What surprised the local forces ordered to restore order was that many of the same hooligans stayed away, fearful of venturing into what they claimed to be endless depths.\n\nIndeed, after further investigation, these spaces are far larger than they would appear on blueprints. With some convincing from their dear friend, Lacey, Jay and Maisie shall mount expeditions into these complexes to discover if they are simple things like furniture stores gathering ottoman chairs, or hiding something more valuable."
WLD_BR_tt:0 "§8Extra means of securing materials from these strange mazes will become available.§!"

WLD_MW:0 "On Tulpar's Wings"
WLD_MW_desc:0 "Even if we have made great strides to improve our economy, there is one area which has always been at a danger of being forgotten in America. Infrastructure, be it urban or especially long-distance, remains an avenue untouched by our efforts so far. This cannot continue as the transport of goods, both civilian and martial, is vital.\n\nMany firms, like the Pony Express, have volunteered to operate railways, highways, and anything in between for a surprisingly cheap price. Soon our men will move swiftly as if ridding the celestial horse Tulpar, the namesake of one of the Express' freighters."

WLD_FF:0 "The Greater Purpose of Remnant"
WLD_FF_desc:0 "While the researchers at the SCP Foundation are no doubt highly skilled when it concerns the anomalies they have spent years containing, they lack a certain touch for the 'spiritual'. William Afton, one of our closer contractors, has gathered enough notes on such spheres - further enhanced by the experiments conducted by both Dr. Phineas Taggart and Dr. Talbert - to show them the way forward.\n\nThe so-called 'haunted metal', supposedly capable of grounding the remnant memories of people that have passed onto the other side, could be utilized and injected into both flesh and mechanical beings to allow them a glimpse beyond the veil, not to mention increasing their power."

WLD_FP1:0 "A Much Better Home"
WLD_FP1_desc:0 "Once upon a time, there was a nation that lost something - not knowing where it had been lost. The people were running in circles over and over, walking and fighting for days and days, and more days. Until one of these days, a very special day, it was found once again - and brought back together at last.\n\nThe people of this nation were tired before, but they wished with all their strength and were shown a way home, to a much better home.  One free of pain and hurt, of sorrow and shame.\n\nThe rest of the world must understand that getting there will be no easy task, but if they oblige, they will join their American cousins - in their own Wonderland."
WLD_FP1_tt:0 "§4We shall invite the rest of the world into our Wonderland.§!"

WLD_FP2:0 "Shatter the Mekhanites"
WLD_FP2_desc:0 "Through the course of our relationship with the SCP Foundation, we were made aware of various hostile groups seeking to undermine the veil protecting humanity from the world of anomaly. From the regime remnants of the OBSKURA to the decentralized militants of the Serpent's Hand, our partners have many enemies, yet none so curious as the Church of the Broken God.\n\nThese people worship an ancient deity known as Mekhane, abhoring all flesh and believing in the coming mechanical salvation if the pieces of their savior are brought together. With numerous reports of their continued successes across Mexico, we must act now, lest the supposed 'benevolent god' dooms our own project."
WLD_FPCon_tt:0 "§4Our new guests shall be fully embraced, considered a core part of our nation.§!"
WLD_controls_mexico:0 "§3Mexico, the Caribbean, and Central America§! have been brought into Wonderland."

WLD_FP3:0 "Return to the Green Valley"
WLD_FP3_desc:0 "As the founder of the business that started it all traces his origins to the Southern continent, it would be wise to move our efforts into bringing the denizens of Chile and other farther Latin American nations into the safety that we have established.\n\nAs it turns out, there are some that claim to have found an alternate entrance to our lands as seen in the reports discovered in the Ecological Park in La Plata. However, this seemingly peaceful island of Valle Verde is not what it seems, and we must save those trapped in that world from the ravenous hunger."
WLD_controls_south_america:0 "§3South America§! has been brought into Wonderland."

WLD_FP4:0 "Cooperate with NAMAD"
WLD_FP4_desc:0 "There are many groups orbiting around the activities pursued by the brilliant minds at REGNAD, although most of them are confined to the borders of the United States. Luckily for us, there is one corporation which could aid our mission up North, utilizing new technologies just as Computing did before.\n\nNorthern Alberta Mining and Development, or NAMAD for short, has experience in using tools such as the Remote-Operated Compact Tunneller or the 'Seismic Tremor Detection' which would be invaluable in securing the frigid lands of the Canadian wilderness."
WLD_controls_canada:0 "§3Canada§! has been brought into Wonderland."

WLD_FP5:0 "Calling Agent Alomar"
WLD_FP5_desc:0 "It remains true that our men are ill-prepared to operate in the lands of Africa, for the continent itself still remains a 'dark land' to the vast majority of our population. Nevertheless, the indigenous populations there have been under tyrannical chains for far too long, not to mention the distressing tales of bio-terrorist activity as well as pre-historic monsters re-emerging to wreak havoc.\n\nThankfully, we know a woman perfect to guide us through West Africa and beyond, Sheva Alomar - a native of those lands and a recent S.T.A.R.S. recruit recommended by agent Redfield."
WLD_controls_africa:0 "§3Africa§! has been brought into Wonderland."

WLD_FP6:0 "Investigating Lebedev's Reports"
WLD_FP6_desc:0 "Beyond overseeing the exploration of the mysterious happenings in the town of Old Oakburn, Dr. Professor Fyodor Petrov Lebedev wrote one of the most detailed accounts of the blood pact that turned Lower Saxony's Weser River into a place of grief.\n\nAs we turn our attention to Europe, the great mother of all kinds of old horrors and curses afflicting the wider world, it would be wise to heed the scholar's warnings and utilize his teachings to rescue any persons susceptible to sinister cosmic forces."
WLD_controls_europe:0 "§3Europe§! has been brought into Wonderland."

WLD_FP7:0 "Never-Ending Bliss"
WLD_FP7_desc:0 "It must have been a terrible feeling to lose control of their thoughts, and their minds, and their selves - but humanity beyond America is getting better now. Previously, they were seeking a never-ending bliss, and that is what we have offered them.\n\nAnything can be real when they are with us, when they need our help the most. In turn, the people will accept their new lives in Wonderland, a magical place where everyone can find a way to keep going beyond their end."
WLD_controls_world:0 "§3The remainder of the World§! has been brought into Wonderland."

### Ideas and Dynamic Modifiers ###

WLD_Pol_Start:0 "Just Hold On... a Little Longer"
WLD_Pol_Start_desc:0 "The past months have been, difficult, for all people within our state. The total collapse of Federal authority, leading into the rampant downfall of all standards under the nascent Syndicalist regime, has left many with no faith in the future. But one day, all of this shall pass."

WLD_Pol_Route1A:0 "Grief Is an Illness"
WLD_Pol_Route1A_desc:0 "We must be strong enough to deal with whatever fate has thrown at us, capable enough of protecting that which we hold as most dear. Mr. Walten shall now allow recent grief to overcome him, no matter how bad it gets."

WLD_Pol_Route1B:0 "Towards the Golden Land"
WLD_Pol_Route1B_desc:0 "With the real skill and a dash of magic, our way towards 'Wonderland' becomes ever clearer. Our nation shall be slowly transformed into a true paradise, a golden landscape where no one is left needy or destitute."

WLD_Pol_Route1C:0 "Promise of Reunion"
WLD_Pol_Route1C_desc:0 "Through art and love, the 'Wonderland' experiment has provided a safe refuge for countless souls left at the crossroads. Even if we are yet to reunite with all that are close to us, we can be assured that we will meet again some sunny day."

WLD_Pol_Route2A:0 "Canvases of Blank Slates"
WLD_Pol_Route2A_desc:0 "We have all become broken, torn apart, and burnt to the last fiber. Yet there is no need to fret, as 'Bon' has corrected himself, and thus everyone else can be restored from a blank canvas into something beautiful made anew."

WLD_Pol_Route2B:0 "Purifying the Past Nightmare"
WLD_Pol_Route2B_desc:0 "The road to reconciling the nightmare many have found themselves in shall not be easy, but there is something which can help them greatly. If only they pass through the world which is not fully ours, meant to purify their deepest demonic desires, the gate to Wonderland shall surely open."

WLD_Pol_Route2C:0 "Humanity's Sins Overthrown"
WLD_Pol_Route2C_desc:0 "We shall shepherd the masses towards their ultimate salvation, to a state of bliss the false messiahs of old could have never provided. Anyone unwilling to listen and change their ways shall be thrown away, to languish away from the joys of our Wonderland."

WLD_Pol_DGR1:0 "Ultimate Hope"
WLD_Pol_DGR1_desc:0 "We cannot hope to preserve the sanity of our people unless we provide them with paragons, true role models of virtue to follow. Of course, this might require us to make certain questionable choices, such as forcing optimism into people against their seemingly better wishes, but such a price is ultimately small for hope to reign again."

WLD_Pol_DGR2:0 "Ultimate Despair"
WLD_Pol_DGR2_desc:0 "The most valuable thing in the situation that our state finds itself in is to hear the lament of our enemies, to know that they cannot hurt the most vulnerable members of our society. That is exactly why we must use all tools at our disposal to bring about the end of the hostile regimes, for when despair shall take root they will be left defenceless and incapable of withstanding our march."

WLD_Mil_Idea1A:0 "Keep Away"
WLD_Mil_Idea1A_desc:0 "Mr. Peterson does not like noisy and lousy neighbors trying to interrupt business that is not their own, and we wholeheartedly agree with such a stance. We must ensure that his tactical knowledge and our resources can combine to provide beneficial results for our forces."

WLD_Mil_Idea1B:0 "Stay Away"
WLD_Mil_Idea1B_desc:0 "Mr. Peterson does not like noisy and lousy neighbors trying to interrupt business that is not their own, and we wholeheartedly agree with such a stance. We must ensure that his tactical knowledge and our resources can combine to provide beneficial results for our forces."

WLD_Mil_Idea1C:0 "Keep Away, Stay Away"
WLD_Mil_Idea1C_desc:0 "Mr. Peterson does not like noisy and lousy neighbors trying to interrupt business that is not their own, and we wholeheartedly agree with such a stance. We must ensure that his tactical knowledge and our resources can combine to provide beneficial results for our forces."

WLD_Mil_Idea2A:0 "Calling Upon the Storm of Rage"
WLD_Mil_Idea2A_desc:0 "There are many of those who seemingly cry for vengeance from beyond the veil. Even if they might not be necessarily tangible, or bound to reality, their psychological effect is clear for all to see. Let us harness this power and aim it against our enemies in a true diluvian malignancy."

WLD_Mil_Idea2B:0 "Calling Upon the Storm of Rage"
WLD_Mil_Idea2B_desc:0 "There are many of those who seemingly cry for vengeance from beyond the veil. Even if they might not be necessarily tangible, or bound to reality, their psychological effect is clear for all to see. Let us harness this power and aim it against our enemies in a true diluvian malignancy."

WLD_Mil_Idea2C:0 "Calling Upon the Storm of Rage"
WLD_Mil_Idea2C_desc:0 "There are many of those who seemingly cry for vengeance from beyond the veil. Even if they might not be necessarily tangible, or bound to reality, their psychological effect is clear for all to see. Let us harness this power and aim it against our enemies in a true diluvian malignancy."

WLD_FF_Mil1:0 "Animatronic Direction: Stitchwraith"
WLD_FF_Mil1_desc:0 "We have managed to convince, or rather been convinced by, William Afton to cooperate with Dr. Phineas Taggart on the implementation of true military robots within our ranks. Having been given the cryptonym of 'Stitchwraith', these creations shall enhance our armies' combat capabilities."

WLD_FF_Mil2:0 "Animatronic Direction: Helpy"
WLD_FF_Mil2_desc:0 "Thanks to the immense help from the board of Fazbear Entertainment, William Afton was convinced to downsize his ambitions and continue working on the 'Helpy' plan we have previously agreed on. His experience in robotics shall be confined to purely support roles for our army."

WLD_Mil_Air:0 "Project 'Freedom Guardian'"
WLD_Mil_Air_desc:0 "With the employment of certain 'tools' provided to us thanks to the utilization of Giza Glass, our range of protecting the state has increased enormously. We can now call upon these 'Guardians' to secure whatever distant land that is under our control."

WLD_Mil_Navy:0 "Sailing the Obra Dinn"
WLD_Mil_Navy_desc:0 "As the new direction of our navy takes shape, many frightened sailors have proclaimed the return of the legendary Obra Dinn, as well as many other spectral vessels. Let us use this flawed perception to outmaneuver our enemies on the vast oceans."

WLD_Mil_RE:0 "Special Tactics and Rescue Service"
WLD_Mil_RE_desc:0 "By combining the best of the best from both military and academic backgrounds, our policing and commando forces shall become unstoppable when it comes to dealing with volatile urban and anti-terrorist situations - all thanks to the further expansion of the S.T.A.R.S."

WLD_ResearchA:0 "Analyzing the Anomalies"
WLD_ResearchA_desc:0 "The world is full of anomalies, both big and small, and it would be a shame to leave those who come after us with no awareness of these phenomena. Thanks to our partnership with the Foundation, we shall utilize this knowledge to further the field of scientific research beyond what was seen in America so far."

WLD_ResearchB:0 "Mastery Over the Tangible with the Intangible"
WLD_ResearchB_desc:0 "Both Remnant and its Agony variant, forces which can seemingly make what was lost real again, used to be secrets unknown by any scholar. However, we have made significant breakthroughs in their field, and thus can proclaim that even that which is intangible has been brought into the chains of the realm of human understanding."

WLD_MWIdea:0 "A Space for Freighters"
WLD_MWIdea_desc:0 "Our vast lands need a reliable way of both transporting goods and letting passengers connect to any city they would desire to find themselves in. Thankfully, the Pony Express and other similar companies are willing to provide such services for a relatively small entry price."

WLD_EcoStart:0 "The Lack of Quality"
WLD_EcoStart_desc:0 "Quality, quality food, quality entertainment, quality fun. All of these are lacking in the economic landscape of our state, not only in the forgotten middle sector of Michigan but wider America as a whole. While Felix Kranken is relatively capable as a manager, he has certain 'character flaws' making him incapable of handling the restoration of our economy on his own. Someone will need to be found that is willing and able to save our businesses from going under."

WLD_EcoA:0 "Lacey's Entrepreneurship - Slow Tomorrow"
WLD_EcoA_desc:0 "The consumers are ceaseless; they demand more and more no matter how hard it is. While still slow at improving our condition, Lacey will surely manage to accomplish the goals laid out before her. She must; after all, she has no other choice as everyone relies on her now."

WLD_EcoB:0 "Lacey's Entrepreneurship - Trying Hard"
WLD_EcoB_desc:0 "Lacey will not be beaten down anymore; she will show everyone that no matter what she sets her mind to can be a success. Thanks to her efforts, our economy continues to improve at a pace not seen before under the leadership of Mr. Kranken."

WLD_EcoC:0 "Lacey's Entrepreneurship - Trying Hard"
WLD_EcoC_desc:0 "Lacey will not be beaten down anymore; she will show everyone that no matter what she sets her mind to can be a success. Thanks to her efforts, our economy continues to improve at a pace not seen before under the leadership of Mr. Kranken."

WLD_EcoD:0 "Lacey's Entrepreneurship- Trying Hard"
WLD_EcoD_desc:0 "Lacey will not be beaten down anymore; she will show everyone that no matter what she sets her mind to can be a success. Thanks to her efforts, our economy continues to improve at a pace not seen before under the leadership of Mr. Kranken."

WLD_EcoE:0 "Lacey's Entrepreneurship - The Best One in the World"
WLD_EcoE_desc:0 "The long nightmare of our state failing to provide for everyone is at an end, in no small part due to the work done by our boss of a girl, Lacey. She can finally rest, knowing that everyone is satisfied with what has been done."

WLD_ForPol_Idea:0 "We are All Up in Wonderland, Together!"
WLD_ForPol_Idea_desc:0 "The rest of the world might not realize it yet, but a spirit cannot exist without being tethered to a vessel. What is life in such a broken world if not a premature death, yet our Wonderland provides an anchor for all those that would be lost otherwise. The hard part is over with now, and everyone shall receive a wonderful gift!"

