### Events ###

wlandevent.1.t:0 "The Recent ‘Rust’ of Michigan"
wlandevent.1.d:0 "Undoubtedly the most important Great Lakes state in the USA, as well as a major hub for industrial production coupled with unionist activity, Michigan could easily be described as the second ‘jewel’ of the nascent Combined Syndicates after the capital zone in Chicagoland. While the area around Detroit itself was quickly secured following the declaration of the Second American Revolution, the relative remoteness of the different cities and towns of both the ‘Mitten’ and the Upper Peninsula have proven to provide a considerable challenge when it comes to extending our authority.\n\nWhat’s more, the process has not been without a significant opposition in the form of enemies both internal and external. The former represent the forces of the capitalist order and reaction, such as the Fordists of Dearborn or the Klanist chapters rampant across the Southern part of the state. What’s more, the vile bootlickers of the British crown, stuck in Canada after our British comrades dislodged them a decade prior, have already started conducting small scale actions to disrupt the shipping zones across the Lakes through acts of sabotage and cross-border infiltration.\n\nAll of this has led the smaller businesses of the Steel Belt, of which there are many and which we still lack a particular vision for, to suffer from rampant petty crime and general societal breakdown worse than the one present under Hoover. Bankruptcy, severed supply lines, break-ins, vandalism, extortion - all kinds of behaviors which must be culled under Socialism - have been slowly eroding the confidence of Michiganders living in places like nearby-Detroit’s Brighton in the new Syndicalist Congress and its representatives. Something must be done sooner or later to reinforce the rule of law, one that is just and serves the people, if we are to serve the laborers of all strides and safeguard them from the old menaces lurking in the shadows."
wlandevent.1.a:0 "This all is just... one big uphill battle we have to overcome."
wlandevent.1.b:0 "I don't know what's happening anymore."

wlandevent.2.t:0 "Downtown"
wlandevent.2.d:0 "It seems that our confusion and lack of appropriate action thereof has resulted in the entrepreneurs of Michigan taking an active stance against the new administration. Tired of the seemingly endless string of humiliation, and supposed favoritism towards the factory-industrial sectors dominated by trade unions and the politicians which feed on them, the moms, pops, and managers have set out to find someone who could lead them towards a safe and secure future.\n\nNot wishing to merely replace one socialist figurehead with another, or exchange the Syndicates for the return of Federal tyranny or the demonic hooded Dixiecrats, the people of the largest Great Lake state under our control have instead elected to turn to one of their own.\n\nJack Walten, an immigrant from Chile who settled in the forgotten city of Brighton, has been thrust into the highest office by the needy population of his beloved Livingston County and the wider Detroit area. Both a family man and a valued member of the local community active in various charitable causes, Mr. Walten is the co-owner of the Bon’s Burgers diner together with his associate, Felix Kranken. Only time will tell if he’s strong enough to deal with this new and precarious position Michigan finds itself in."
wlandevent.2.a:0 "Let us bring your family together the right way."
wlandevent.2.b:0 "I don't think we're helping each other."

