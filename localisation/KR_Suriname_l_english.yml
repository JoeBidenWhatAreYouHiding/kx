### Ideas ###
#Starter#
SUR_primitive_economy:0 "Primitive Economy"
SUR_primitive_economy_desc:0 "To describe a Surinamese \"economy\" has always been something of a generous assessment. Industry, such as it is, primarily consists of extraction of bauxite & increasingly scarce gold, as well as farming of balata and occasionally rice for export. Organised market activity is limited, with the banking sector consisting of De Surinaamsche Bank and a postal savings union and most finished goods are imported from the Netherlands or the United States. Any attempt to develop real industry will invariably be slow and develop around our core commodities sectors."
SUR_poor_literacy:0 "Poor Literacy Rate"
SUR_poor_literacy_desc:0 "Limited school capacity and even less education funding means that the majority of our population is entirely or mostly unschooled. The most common books are invariably religious texts which the more fortunate learned to read through teaching by their faith community and not necessarily in Dutch. This has obvious implications for technological advancement, but it remains to be seen if we can muster the resources to materially improve the situation."
SUR_racial_tensions:0 "Creole-Asian Divide"
SUR_racial_tensions_desc:0 ""
SUR_black_monday_idea:0 "Black Monday in Suriname"
SUR_black_monday_idea_desc:0 "Given the absolutely primitive state of our economy, internal industry has been relatively unaffected by Black Monday. However, the global commodity shock has been devastating to an extraction economy like our own, especially for core exports like bauxite and balata. We need to take urgent action to find new markets our re-orient our economy if we are to survive this sudden drop in exports."
SUR_asian_smallholders:0 "Succesful Asian Smallholders"
SUR_asian_smallholders_desc:0 ""
SUR_cash_crop_boom:0 "Cash Crop Boom"
SUR_cash_crop_boom_desc:0 ""

